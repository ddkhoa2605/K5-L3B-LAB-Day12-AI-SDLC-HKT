<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// =====================================================================================
// 0. Dữ liệu trình bày (tên tiếng Việt, màu) — được phép ở UI. Số gameplay lấy từ snap.meta.
// =====================================================================================
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", bong_dien_dien: "bông điên điển", bong_sung: "bông súng" };
const KIND_COLOR = { ca_loc: "#6f8a46", ca_linh: "#cfe0ea", bong_dien_dien: "#f2c230", bong_sung: "#ef7fa6" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển" };
const DISH_COLOR = { ca_loc_nuong_trui: "#c77d36", goi_bong_sung: "#ef7fa6", lau_ca_linh_dien_dien: "#f0b443" };

// Preset v1.0 — CHỈ để chạy sim giả trong demo. Client thật đọc snap.meta từ GET /state.
const TUNING = {
  gather: { duration_s: 180, bounds: { x: [0, 100], d: [0, 30] }, dock_pos: [2, 0], dock_radius: 3, start_pos: [2, 0],
    swim_speed: 4.0, ramp_max_ticks: 6, surface_depth: 0.5, oxygen_max_s: 30, oxygen_refill_per_tick: 6, choke_interval_ticks: 60,
    hp_max: 3, hold_capacity: 12, interact_radius: 2.0, node_yield: 1, regrow_s: 20, catch_radius: 2.0, catch_cooldown_s: 0.5,
    fish_yield: { ca_linh: 3, ca_loc: 1 },
    nodes: [ { id: "N1", kind: "bong_dien_dien", pos: [12, 0] }, { id: "N2", kind: "bong_dien_dien", pos: [28, 0] },
             { id: "N3", kind: "bong_sung", pos: [44, 0] }, { id: "N4", kind: "bong_sung", pos: [60, 0] } ],
    fish_initial: [ { id: "F1", kind: "ca_linh", pos: [15, 5] }, { id: "F2", kind: "ca_loc", pos: [30, 10] }, { id: "F3", kind: "ca_linh", pos: [45, 10] },
                    { id: "F4", kind: "ca_loc", pos: [60, 16] }, { id: "F5", kind: "ca_linh", pos: [75, 5] }, { id: "F6", kind: "ca_loc", pos: [90, 16] } ] },
  quan: { duration_s: 180, bounds: { x: [0, 16], z: [0, 10] }, start_pos: [8, 5], walk_speed: 4.0, ramp_max_ticks: 6, interact_radius: 1.5,
    stoves: [{ id: "B1", pos: [2, 8] }], tables: [{ id: "T1", pos: [9, 2] }], first_customer_tick: 120, customer_interval_s: 15,
    patience_s: 60, eat_s: 10, carry_limit: 1, tip_rate: 0.2, tip_min_patience_ratio: 0.5, tip_reputation: 0.2,
    left_reputation_delta: -0.5, reputation_initial: 3.0, reputation_min: 0, reputation_max: 5 },
  menu: { ca_loc_nuong_trui: { recipe: { ca_loc: 1 }, cook_s: 6, price: 60 },
          goi_bong_sung: { recipe: { bong_sung: 2 }, cook_s: 4, price: 40 },
          lau_ca_linh_dien_dien: { recipe: { ca_linh: 3, bong_dien_dien: 1 }, cook_s: 10, price: 120 } },
};
const SAMPLE_STOCK = { bong_sung: 4, ca_loc: 2, ca_linh: 3, bong_dien_dien: 1 };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function mulberry(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// =====================================================================================
// 1. SIM GIẢ (thay cho chonoi.live). Xuất đúng hình dạng snapshot/event của contract.
// =====================================================================================
class MockBase {
  constructor(mode) { this.mode = mode; this.tick = 0; this.events = []; this.prevBtn = { interact: false, catch: false }; this.done = false; this.reason = null; this.vel = [0, 0]; }
  emit(name, data) { this.events.push({ type: "event", tick: this.tick, phase: this.mode, name, data }); if (this.events.length > 40) this.events.shift(); }
  edges(inp) { const e = { interact: inp.interact && !this.prevBtn.interact, catch: inp.catch && !this.prevBtn.catch }; this.prevBtn = { interact: inp.interact, catch: inp.catch }; return e; }
  move(inp, speed, bounds) {
    const ramp = 3; // xấp xỉ ramp_max_ticks cho demo
    for (let i = 0; i < 2; i++) {
      this.vel[i] += (inp.move[i] * speed - this.vel[i]) / ramp;
      this.pos[i] += this.vel[i] / 60;
      const [lo, hi] = bounds[i];
      if (this.pos[i] <= lo) { this.pos[i] = lo; this.vel[i] = Math.max(0, this.vel[i]); }
      if (this.pos[i] >= hi) { this.pos[i] = hi; this.vel[i] = Math.min(0, this.vel[i]); }
    }
    if (inp.move[0] || inp.move[1]) this.heading = ((Math.atan2(inp.move[1], inp.move[0]) * 180 / Math.PI) + 360) % 360;
  }
}

class MockGather extends MockBase {
  constructor() {
    super("gather"); const t = TUNING.gather;
    this.pos = [...t.start_pos]; this.heading = 0; this.oxMax = t.oxygen_max_s * 60; this.ox = this.oxMax; this.hp = t.hp_max; this.zero = 0; this.cd = 0;
    this.hold = []; this.time = t.duration_s * 60;
    this.nodes = t.nodes.map((n) => ({ ...n, pos: [...n.pos], regrow_ticks: 0 }));
    this.fish = t.fish_initial.map((f) => ({ ...f, pos: [...f.pos], heading_deg: 0 }));
  }
  under() { return this.pos[1] > TUNING.gather.surface_depth; }
  end(reason) { this.done = true; this.reason = reason; this.emit("gather_end", { reason, inventory: { items: reason === "fainted" ? {} : this.items() } }); }
  items() { const o = {}; for (const k of this.hold) o[k] = (o[k] || 0) + 1; return o; }
  step(inp) {
    if (this.done) return; const t = TUNING.gather; const e = this.edges(inp);
    this.tick++; this.time--; this.cd = Math.max(0, this.cd - 1);
    for (const n of this.nodes) if (n.regrow_ticks > 0 && --n.regrow_ticks === 0) this.emit("node_regrown", { node_id: n.id });
    const wasUnder = this.under();
    this.move(inp, t.swim_speed, [t.bounds.x, t.bounds.d]);
    const under = this.under();
    if (under !== wasUnder) this.emit(under ? "dive" : "surface", { pos: [+this.pos[0].toFixed(3), +this.pos[1].toFixed(3)] });
    if (!under) { this.ox = Math.min(this.oxMax, this.ox + t.oxygen_refill_per_tick); this.zero = 0; }
    else {
      const before = this.ox; this.ox = Math.max(0, this.ox - 1);
      if (before > 0 && this.ox === 0) this.emit("oxygen_empty", { oxygen_ticks: 0 });
      if (this.ox === 0 && ++this.zero >= t.choke_interval_ticks) {
        this.zero = 0; this.hp--; this.emit("choke", { hp: this.hp });
        if (this.hp <= 0) { const lost = [...this.hold].reverse(); this.hold = []; this.emit("faint", { cause: "choke", lost, hp: 0 }); this.end("fainted"); return; }
      }
    }
    if (e.interact) {
      if (dist(this.pos, t.dock_pos) <= t.dock_radius) { this.end("docked"); return; }
      if (!under) {
        const c = this.nodes.filter((n) => n.regrow_ticks === 0 && dist(n.pos, this.pos) <= t.interact_radius)
          .sort((a, b) => dist(a.pos, this.pos) - dist(b.pos, this.pos) || (a.id < b.id ? -1 : 1))[0];
        if (c) {
          if (this.hold.length < t.hold_capacity) { this.hold.push(c.kind); c.regrow_ticks = t.regrow_s * 60; this.emit("gather", { node_id: c.id, kind: c.kind, amount: 1 }); }
          else this.emit("hold_full", { action: "gather", node_id: c.id, required: 1, free: 0 });
        }
      }
    }
    if (e.catch && this.cd === 0 && under) {
      const f = this.fish.filter((f) => dist(f.pos, this.pos) <= t.catch_radius)
        .sort((a, b) => dist(a.pos, this.pos) - dist(b.pos, this.pos) || (a.id < b.id ? -1 : 1))[0];
      if (f) {
        const y = t.fish_yield[f.kind], free = t.hold_capacity - this.hold.length;
        if (free >= y) { for (let i = 0; i < y; i++) this.hold.push(f.kind); this.fish = this.fish.filter((x) => x !== f); this.cd = Math.round(t.catch_cooldown_s * 60); this.emit("fish_caught", { fish_id: f.id, kind: f.kind, yield: y }); }
        else this.emit("hold_full", { action: "catch", fish_id: f.id, required: y, free });
      }
    }
    if (this.time <= 0) this.end("time");
  }
  snapshot() {
    const t = TUNING.gather;
    return { type: "snapshot", tick: this.tick, sim_tick: this.tick, mode: "gather", phase: "gather", phase_tick: this.tick,
      state: this.done ? "finished" : "playing", time_left_ticks: this.time, money: 0, earned: 0, reputation: 3, score: 300,
      player: { pos: [...this.pos], vel: [...this.vel], heading_deg: this.heading, oxygen_ticks: this.ox, oxygen_max_ticks: this.oxMax,
        hp: this.hp, hp_max: t.hp_max, zero_oxy_ticks: this.zero, catch_cd_ticks: this.cd, at_surface: !this.under() },
      hold: [...this.hold], hold_count: this.hold.length, hold_capacity: t.hold_capacity,
      nodes: this.nodes.map((n) => ({ id: n.id, pos: n.pos, kind: n.kind, ready: n.regrow_ticks === 0, regrow_ticks: n.regrow_ticks })),
      fish: this.fish.map((f) => ({ id: f.id, pos: f.pos, kind: f.kind, heading_deg: 0 })),
      meta: t, events: [...this.events], finished: this.done, reason: this.reason, error: null };
  }
}

class MockQuan extends MockBase {
  constructor(stock) {
    super("quan"); const t = TUNING.quan;
    this.pos = [...t.start_pos]; this.heading = 0; this.stock = { ...stock }; this.hand = null; this.time = t.duration_s * 60;
    this.stove = { id: "B1", pos: [2, 8], state: "idle", dish: null, cook_ticks_left: 0, ready_ticks: 0 };
    this.customers = []; this.money = 0; this.earned = 0; this.rep = t.reputation_initial; this.nextC = t.first_customer_tick; this.n = 0; this.rng = mulberry(42);
  }
  avail() { const a = { ...this.stock }; for (const c of this.customers) for (const k in c.reserved) a[k] = (a[k] || 0) - c.reserved[k]; return a; }
  drop(c) { if (this.stove.dish && this.stove.dish.order_id === c.id) { this.stove.state = "idle"; this.stove.dish = null; this.stove.cook_ticks_left = 0; } if (this.hand && this.hand.order_id === c.id) this.hand = null; }
  pay(c, reason) { const amount = c.base_price + c.tip; this.money += amount; this.earned += amount; if (c.tip > 0) this.rep = Math.min(5, this.rep + TUNING.quan.tip_reputation);
    this.emit("paid", { order_id: c.id, table_id: c.table_id, base_price: c.base_price, tip: c.tip, amount, reason }); }
  step(inp) {
    if (this.done) return; const t = TUNING.quan; const e = this.edges(inp);
    this.tick++; this.time--;
    const s = this.stove;
    if (s.state === "ready") s.ready_ticks++;
    if (s.state === "cooking" && --s.cook_ticks_left <= 0) { s.state = "ready"; s.ready_ticks = 0; this.emit("dish_ready", { stove_id: s.id, order_id: s.dish.order_id, dish_id: s.dish.dish_id }); }
    for (const c of this.customers) { if (c.state === "waiting") c.patience_ticks_left = Math.max(0, c.patience_ticks_left - 1); else if (c.state === "eating") c.eat_ticks_left = Math.max(0, c.eat_ticks_left - 1); }
    this.move(inp, t.walk_speed, [t.bounds.x, t.bounds.z]);
    if (e.interact) {
      const cand = [];
      const ds = dist(this.pos, s.pos); if (ds <= t.interact_radius) cand.push({ d: ds, o: 0, kind: "stove" });
      const dt = dist(this.pos, [9, 2]); if (dt <= t.interact_radius) cand.push({ d: dt, o: 1, kind: "table" });
      cand.sort((a, b) => a.d - b.d || a.o - b.o);
      const pick = cand[0];
      if (pick && pick.kind === "stove") {
        if (s.state === "idle") {
          const c = this.customers.filter((c) => c.order_status === "reserved" && c.state === "waiting").sort((a, b) => a.order_tick - b.order_tick)[0];
          if (c) { const m = TUNING.menu[c.dish_id]; const items = [];
            for (const k of Object.keys(c.reserved).sort()) { this.stock[k] -= c.reserved[k]; for (let i = 0; i < c.reserved[k]; i++) items.push(k); }
            c.reserved = {}; c.order_status = "assigned"; s.state = "cooking"; s.dish = { order_id: c.id, dish_id: c.dish_id, base_price: m.price }; s.cook_ticks_left = m.cook_s * 60;
            this.emit("cook_started", { stove_id: s.id, order_id: c.id, dish_id: c.dish_id, items, base_price: m.price }); }
        } else if (s.state === "ready" && !this.hand) {
          this.hand = s.dish; this.emit("dish_picked", { stove_id: s.id, order_id: s.dish.order_id, dish_id: s.dish.dish_id }); s.state = "idle"; s.dish = null; s.ready_ticks = 0;
        }
      } else if (pick && pick.kind === "table") {
        const c = this.customers.find((c) => c.table_id === "T1");
        if (c && this.hand && this.hand.order_id === c.id && c.state === "waiting") {
          const ratio = c.patience_ticks_left / (t.patience_s * 60);
          c.base_price = this.hand.base_price; c.tip = ratio >= t.tip_min_patience_ratio ? Math.floor(c.base_price * t.tip_rate) : 0;
          c.state = "eating"; c.order_status = "served"; c.eat_ticks_left = t.eat_s * 60; this.hand = null;
          this.emit("served", { order_id: c.id, table_id: c.table_id, dish_id: c.dish_id, patience_ticks_left: c.patience_ticks_left, base_price: c.base_price, tip: c.tip });
        }
      }
    }
    for (const c of [...this.customers]) {
      if (c.state === "eating" && c.eat_ticks_left === 0) { this.pay(c, "finished_eating"); this.customers = this.customers.filter((x) => x !== c); }
      else if (this.time > 0 && c.state === "waiting" && c.patience_ticks_left === 0) {
        this.rep = clamp(this.rep + t.left_reputation_delta, t.reputation_min, t.reputation_max); this.drop(c); this.customers = this.customers.filter((x) => x !== c);
        this.emit("customer_left", { order_id: c.id, table_id: c.table_id, reason: "patience", reputation: this.rep });
      }
    }
    if (this.time > 0 && this.tick === this.nextC) {
      this.nextC += t.customer_interval_s * 60;
      if (!this.customers.length) {
        const a = this.avail();
        const ok = Object.keys(TUNING.menu).sort().filter((d) => Object.entries(TUNING.menu[d].recipe).every(([k, n]) => (a[k] || 0) >= n));
        if (!ok.length) this.emit("no_dish", {});

      this.emit("quan_end", { reason: "time", money: this.money, earned: this.earned, shift_earned: this.earned, reputation: this.rep });
    }
  }
  snapshot() {
    const stock = {}; for (const k of Object.keys(this.stock).sort()) if (this.stock[k] > 0) stock[k] = this.stock[k];
    const c0 = this.customers.find((c) => c.table_id === "T1");
    return { type: "snapshot", tick: this.tick, sim_tick: this.tick, mode: "quan", phase: "quan", phase_tick: this.tick,
      state: this.done ? "finished" : "playing", time_left_ticks: this.time, money: this.money, earned: this.earned, reputation: +this.rep.toFixed(3),
      score: this.earned + 100 * Math.floor(this.rep), player: { pos: [...this.pos], vel: [...this.vel] }, stock, hand: this.hand,

      customers: this.customers.map((c) => ({ ...c, reserved: { ...c.reserved } })),
      meta: TUNING.quan, events: [...this.events], finished: this.done, reason: this.reason, error: null };
  }
}

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, ...o });
function gradientTex(stops) {

}
function checkerTex() {

  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? "#f2efe6" : "#1c1c1c"; g.fillRect(x * 8, y * 8, 8, 8); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 1); return t;
}

  const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.5, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)");

}
const DOT = dotTex();

class Particles {
  constructor(scene, n, color, size, opacity = 0.8, blending = THREE.NormalBlending) {
    this.n = n; this.p = new Float32Array(n * 3).fill(-9999); this.v = new Float32Array(n * 3); this.life = new Float32Array(n); this.i = 0;
    this.geo = new THREE.BufferGeometry(); this.geo.setAttribute("position", new THREE.BufferAttribute(this.p, 3));
    this.pts = new THREE.Points(this.geo, new THREE.PointsMaterial({ color, size, map: DOT, transparent: true, opacity, depthWrite: false, blending }));
    this.pts.frustumCulled = false; scene.add(this.pts);
  }
  spawn(x, y, z, count, spread, vy, vxz = 0.3) {
    for (let c = 0; c < count; c++) { const k = this.i++ % this.n;
      this.p[k * 3] = x + (Math.random() - 0.5) * spread; this.p[k * 3 + 1] = y + (Math.random() - 0.5) * spread; this.p[k * 3 + 2] = z + (Math.random() - 0.5) * spread;
      this.v[k * 3] = (Math.random() - 0.5) * vxz; this.v[k * 3 + 1] = vy * (0.6 + Math.random() * 0.8); this.v[k * 3 + 2] = (Math.random() - 0.5) * vxz; this.life[k] = 1.5 + Math.random() * 2; }
  }
  update(dt, t, ceil = Infinity) {
    for (let k = 0; k < this.n; k++) { if (this.life[k] <= 0) continue;
      this.life[k] -= dt; this.p[k * 3] += (this.v[k * 3] + Math.sin(t * 3 + k) * 0.25) * dt; this.p[k * 3 + 1] += this.v[k * 3 + 1] * dt; this.p[k * 3 + 2] += this.v[k * 3 + 2] * dt;
      if (this.life[k] <= 0 || this.p[k * 3 + 1] > ceil) { this.life[k] = 0; this.p[k * 3 + 1] = -9999; } }
    this.geo.attributes.position.needsUpdate = true;
  }
}

const CAUSTIC_GLSL = `
float caustic(vec2 p, float t){
  float v = 0.0;
  for (int k = 0; k < 3; k++) {
    float fk = float(k);
    vec2 q = p * (1.0 + fk * 0.6) + vec2(t * 0.15 * (fk + 1.0), -t * 0.1);
    q += 0.6 * vec2(sin(q.y * 1.7 + t), cos(q.x * 1.3 - t * 0.8));
    v += abs(sin(q.x * 2.0) + sin(q.y * 2.0));
  }
  v /= 3.0;
  return pow(clamp(1.0 - v * 0.6, 0.0, 1.0), 5.0);
}`;

      time.value = t;
      const arr = surfGeo.attributes.position.array;
      for (let i = 0; i < arr.length; i += 3) { const x = surfBase[i] + 50; arr[i + 1] = surfBase[i + 1] + 0.09 * Math.sin(x * 0.8 + t * 2) + 0.05 * Math.sin(x * 1.9 - t * 1.4); }
      surfGeo.attributes.position.needsUpdate = true;
      for (const w of weeds) w.g.rotation.z = Math.sin(t * 1.2 + w.ph) * 0.16;
      for (const r of rays) { r.r.material.uniforms.uA.value = 0.08 + 0.06 * Math.sin(t * 0.7 + r.ph); r.r.position.x = r.x + Math.sin(t * 0.3 + r.ph) * 1.5; }

      // đồng bộ nút
      for (const n of snap.nodes || []) {
        if (!nodes.has(n.id)) nodes.set(n.id, makeNode(n));
        const v = nodes.get(n.id); const regrow = (snap.meta.regrow_s || 20) * 60;
        const target = n.ready ? 1 : 0.15 + 0.5 * (1 - n.regrow_ticks / regrow);
        v.pop = Math.max(0, v.pop - dt * 2); const s = lerp(v.flower.scale.x, target, 0.15) + v.pop * 0.4; v.flower.scale.setScalar(s);
        v.g.position.y = 0.04 * Math.sin(t * 1.6 + n.pos[0]);
      }
      // đồng bộ cá (id biến mất = bị bắt -> xóa mesh)
      const live = new Set((snap.fish || []).map((f) => f.id));
      for (const [id, v] of fish) if (!live.has(id)) { scene.remove(v.g); fish.delete(id); }
      for (const f of snap.fish || []) {
        if (!fish.has(f.id)) fish.set(f.id, makeSchool(f));
        for (const m of fish.get(f.id).members) { const a = t * m.w + m.ph; const dx = -Math.sin(a) * m.r * 1.6, dy = Math.cos(a * 2) * m.r * 0.8;
          m.o.position.set(Math.cos(a) * m.r * 1.6, Math.sin(a * 2) * m.r * 0.4 + m.yo, Math.sin(a) * m.r * 0.9);
          m.o.rotation.z = Math.atan2(dy, dx); m.o.scale.y = Math.abs(m.o.scale.y) * (dx < 0 ? -1 : 1); }
      }

      // Út Sen
      const pl = snap.player; const [px, pd] = pl.pos; const speed = Math.hypot(...(pl.vel || [0, 0]));
      sen.root.position.set(px, -pd + (pl.at_surface ? 0.15 * Math.sin(t * 2.5) : 0), 0.2);
      const h = (pl.heading_deg || 0) * Math.PI / 180; const left = Math.cos(h) < -0.01;
      sen.root.rotation.z = left ? -(h - Math.PI) : -h; sen.root.scale.x = left ? -1.3 : 1.3;
      const k = 3 + speed * 2.2; sen.legs.forEach((l, i) => l.rotation.z = Math.sin(t * k + i * Math.PI) * (0.15 + speed * 0.08));
      sen.arms.forEach((a, i) => a.rotation.z = speed > 0.3 ? t * (2 + speed) + i * Math.PI : Math.PI + Math.sin(t * 2 + i) * 0.4);
      if (!pl.at_surface && speed > 0.5 && t - lastBubble > 0.12) { lastBubble = t; bubbles.spawn(px + Math.cos(h) * 0.9, -pd + 0.2, 0.3, 2, 0.2, 1.8); }
      ring.position.set(px, -pd, 0.5); const r = pl.at_surface ? snap.meta.interact_radius : snap.meta.catch_radius;
      ring.scale.setScalar(r / 2); ringMat.color.set(pl.at_surface ? "#ffffff" : "#9ff2ff"); ringMat.opacity = pl.catch_cd_ticks > 0 && !pl.at_surface ? 0.1 : 0.35;
      bubbles.update(dt, t, 0); sparks.update(dt, t);

      // camera bám theo
      shake = Math.max(0, shake - dt);
      const cx = clamp(px, 8, 92), cy = clamp(-pd + 1.5, -24, 3);
      camera.position.x = lerp(camera.position.x, cx, 0.08) + (Math.random() - 0.5) * shake; camera.position.y = lerp(camera.position.y, cy, 0.08) + (Math.random() - 0.5) * shake;
      camera.position.z = 17; camera.lookAt(camera.position.x, camera.position.y - 0.5, 0);
      sun.position.set(camera.position.x + 16, 13, -60);
    },
  };
}

const $ = (id) => document.getElementById(id);
const setHTML = (el, h) => { if (el._h !== h) { el.innerHTML = h; el._h = h; } };
const fmt = (ticks) => { const s = Math.ceil(Math.max(0, ticks) / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const chip = (k, n, extra = "") => `<span class="chip"><span class="dot" style="background:${KIND_COLOR[k] || "#bbb"}"></span>${KIND_NAME[k] || k} ×${n}${extra}</span>`;

    const counts = {}; snap.hold.forEach((k) => counts[k] = (counts[k] || 0) + 1);
    const choke = p.oxygen_ticks === 0 && !p.at_surface ? `<div class="row warn">Ngạt! Mất 1 Máu sau ${((60 - p.zero_oxy_ticks) / 60).toFixed(1)}s, nổi lên ngay</div>` : "";
    setHTML($("panel"), `<h2>Buổi sáng · Lặn & Hái</h2><div class="sub">Sông Chín Khúc, chợ nổi Rạch Sen</div>

      <div class="row"><span>Máu</span><span class="hearts">${"♥".repeat(p.hp)}${"♡".repeat(Math.max(0, p.hp_max - p.hp))}</span></div>${choke}

    const near = (snap.meta.dock_pos && Math.hypot(p.pos[0] - snap.meta.dock_pos[0], p.pos[1] - snap.meta.dock_pos[1]) <= snap.meta.dock_radius);
    setHTML($("hint"), p.at_surface
      ? `<kbd>WASD</kbd> bơi · <kbd>S</kbd> lặn · <kbd>E</kbd> ${near ? "<b>cập bến</b> (kết thúc buổi sáng)" : "hái bông"} · <kbd>R</kbd> chơi lại`

    const kinds = Object.keys(KIND_NAME).filter((k) => snap.stock[k]);
    const stockHtml = kinds.length ? kinds.map((k) => chip(k, avail[k], reservedTotal[k] ? ` <span class="muted">(giữ ${reservedTotal[k]})</span>` : "")).join("") : `<span class="muted">Kho trống</span>`;

    const orders = snap.customers.map((c) => `<div class="row"><span>${c.id} · ${DISH_NAME[c.dish_id]}</span><span class="muted">${c.state === "waiting" ? Math.ceil(c.patience_ticks_left / 60) + "s" : "đang ăn"}</span></div>`).join("") || `<div class="muted">Chưa có khách</div>`;
    setHTML($("panel"), `<h2>Buổi tối · Quán nhà bè Má Tư</h2><div class="sub">Đèn dây vàng, khói bếp</div>
      <div class="row"><span>Thời gian ca</span><span class="big">${fmt(snap.time_left_ticks)}</span></div>
      <div class="row"><span>Tiền</span><span class="big" style="color:var(--gold)">${snap.money}k</span></div>
      <div class="row"><span>Uy tín</span><span style="color:var(--gold)">${stars} <span class="muted">${snap.reputation.toFixed(1)}</span></span></div>
      <div class="row"><span>Kho khả dụng</span></div><div class="chips">${stockHtml}</div>
      <div class="row"><span>Bếp B1</span><span>${stoveTxt}</span></div>
      <div class="row"><span>Trên tay</span><span>${snap.hand ? DISH_NAME[snap.hand.dish_id] : '<span class="muted">trống</span>'}</span></div>
      <div class="row" style="margin-top:10px"><b>Món khách gọi</b></div>${orders}`);
    setHTML($("hint"), `<kbd>WASD</kbd> đi · <kbd>E</kbd> ở bếp: nấu / bưng · <kbd>E</kbd> ở bàn: phục vụ · <kbd>R</kbd> chơi lại`);
  }
  const ov = $("overlay");
  if (snap.finished) {
    ov.hidden = false;
    if (snap.mode === "gather") {
      const why = { docked: "Cập bến an toàn", time: "Hết giờ buổi sáng", fainted: "Út Sen ngất, giỏ rơi hết" }[snap.reason] || snap.reason;
      const inv = state.inventory || {}; const list = Object.entries(inv).map(([k, n]) => chip(k, n)).join("") || '<span class="muted">giỏ trống</span>';
      setHTML(ov, `<div class="card"><h1>${why}</h1><div class="muted">File kho mang về quán:</div><div class="chips" style="justify-content:center;margin-top:8px">${list}</div>
        <button id="toQuan">Mở quán buổi tối (2)</button></div>`);
      const b = $("toQuan"); if (b && !b._w) { b._w = 1; b.onclick = () => switchMode("quan"); }
    } else {
      setHTML(ov, `<div class="card"><h1>Hết ca</h1><div class="row"><span>Tiền</span><b>${snap.money}k</b></div><div class="row"><span>Uy tín</span><b>${snap.reputation.toFixed(1)}</b></div>
        <div class="row"><span>Điểm = earned + 100 × floor(uy tín)</span><b class="big">${snap.score}</b></div><button id="again">Chơi lại (R)</button></div>`);
      const b = $("again"); if (b && !b._w) { b._w = 1; b.onclick = restart; }
    }
  } else ov.hidden = true;
}

const TOAST = {
  oxygen_empty: () => ["Hết oxy! Nổi lên ngay", "bad"], choke: (d) => [`Ngạt! Còn ${d.hp} Máu`, "bad"], faint: (d) => [`Út Sen ngất, rơi ${d.lost.length} món`, "bad"],
  gather: (d) => [`+${d.amount} ${KIND_NAME[d.kind]}`, "good"], node_regrown: (d) => [`Bông ${d.node_id} nở lại`, ""],
  fish_caught: (d) => [`+${d.yield} ${KIND_NAME[d.kind]}`, "good"], hold_full: (d) => [`Giỏ đầy: cần ${d.required}, còn ${d.free} chỗ`, "bad"],
  customer_arrived: (d) => [`Khách ${d.order_id} gọi ${DISH_NAME[d.dish_id]}`, ""], no_dish: () => ["Khách tới mà kho không đủ món nào", "bad"],
  cook_started: (d) => [`Bắt đầu nấu ${DISH_NAME[d.dish_id]}`, ""], dish_ready: (d) => [`Món chín: ${DISH_NAME[d.dish_id]}`, "gold"],
  dish_picked: (d) => [`Bưng ${DISH_NAME[d.dish_id]}`, ""], served: (d) => [`Đã phục vụ ${d.order_id}${d.tip ? `, khách sẽ boa ${d.tip}k` : ""}`, "good"],
  paid: (d) => [`+${d.amount}k${d.tip ? ` (boa ${d.tip}k)` : ""}`, "gold"],
  customer_left: (d) => [d.reason === "patience" ? `Khách ${d.order_id} bỏ đi, uy tín ${d.reputation.toFixed(1)}` : `Khách ${d.order_id} về (đóng quán)`, d.reason === "patience" ? "bad" : ""],
};
function toast(text, cls) {
  const el = document.createElement("div"); el.className = "toast " + cls; el.textContent = text; $("toasts").prepend(el);
  while ($("toasts").children.length > 6) $("toasts").lastChild.remove();
  setTimeout(() => el.classList.add("out"), 2600); setTimeout(() => el.remove(), 3100);
}

// =====================================================================================
// 4. Vòng chạy: bước sim giả 60 tick/s, đọc snapshot, chống lặp event theo tick
// =====================================================================================
const renderer = new THREE.WebGLRenderer({ canvas: $("cv"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const views = { gather: makeGatherView(), quan: makeQuanView() };
const composer = new EffectComposer(renderer); const rpass = new RenderPass(views.gather.scene, views.gather.camera); composer.addPass(rpass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.5, 0.8); composer.addPass(bloom); composer.addPass(new OutputPass());
const state = { mode: "gather", sim: null, lastTick: 0, inventory: null };

const keys = new Set();
addEventListener("keydown", (e) => { const k = e.key.toLowerCase(); if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
  if (e.repeat) return; keys.add(k); if (k === "r") restart(); if (k === "1") switchMode("gather"); if (k === "2") switchMode("quan"); });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
function readInput(mode) {
  const has = (...ks) => ks.some((k) => keys.has(k));
  const mx = (has("d", "arrowright") ? 1 : 0) - (has("a", "arrowleft") ? 1 : 0);
  let my = (has("s", "arrowdown") ? 1 : 0) - (has("w", "arrowup") ? 1 : 0); if (mode === "quan") my = -my; // gather: xuống = +d; quán: lên = +z (bắc)
  const L = Math.hypot(mx, my); return { move: L > 1 ? [mx / L, my / L] : [mx, my], interact: keys.has("e"), catch: keys.has(" ") };
}
function switchMode(m) {
  views.quan.clearBubbles(); state.mode = m; state.lastTick = 0;
  state.sim = m === "gather" ? new MockGather() : new MockQuan(state.inventory ?? SAMPLE_STOCK);
  const v = views[m]; rpass.scene = v.scene; rpass.camera = v.camera; bloom.strength = v.bloom.strength; bloom.radius = v.bloom.radius; bloom.threshold = v.bloom.threshold;
  document.querySelectorAll("#topbar button").forEach((b) => b.classList.toggle("on", b.dataset.m === m)); $("overlay").hidden = true; resize();
}
function restart() { switchMode(state.mode); }
document.querySelectorAll("#topbar button").forEach((b) => b.onclick = () => switchMode(b.dataset.m));
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); for (const v of Object.values(views)) { v.camera.aspect = w / h; v.camera.updateProjectionMatrix(); } }
addEventListener("resize", resize);

let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  const inp = readInput(state.mode); let n = 0;
  while (acc >= 1 / 60 && n < 8) { state.sim.step(inp); acc -= 1 / 60; n++; } if (n === 8) acc = 0;
  const snap = state.sim.snapshot(); const view = views[snap.mode];
  if (snap.tick < state.lastTick) state.lastTick = 0;                      // restart
  for (const ev of snap.events) if (ev.tick > state.lastTick) {           // chống lặp: chỉ event mới hơn snapshot trước
    const f = TOAST[ev.name]; if (f) { const [txt, cls] = f(ev.data); toast(txt, cls); }
    if (ev.name === "gather_end") state.inventory = ev.data.inventory.items;
    view.onEvent(ev, snap);
  }
  state.lastTick = snap.tick;
  view.update(snap, dt, now / 1000); hud(snap); composer.render();
  requestAnimationFrame(frame);
}
try { switchMode("gather"); requestAnimationFrame(frame); }
catch (e) { $("err").style.display = "block"; $("err").textContent = "Lỗi khởi tạo: " + e.message; throw e; }
window.addEventListener("error", (e) => { $("err").style.display = "block"; $("err").textContent = "Lỗi: " + e.message; });
</script>
</body>
</html>
