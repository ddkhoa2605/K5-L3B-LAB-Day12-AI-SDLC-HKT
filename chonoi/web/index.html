// CẢNH QUÁN NHÀ BÈ BAN ĐÊM (QUAN MODE)
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 116, bottom = 44;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const now = performance.now();

  if (hc) {
    ctx.fillStyle = HC.floor; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  } else {
    // 1. Mặt nước sông đêm huyền ảo phản chiếu ánh vàng nhà bè
    const riverNightGrad = ctx.createLinearGradient(0, top - 20, 0, (Z + 2) * s + 60);
    riverNightGrad.addColorStop(0, "#030712");
    riverNightGrad.addColorStop(0.5, "#0b192c");
    riverNightGrad.addColorStop(1, "#030712");
    ctx.fillStyle = riverNightGrad; ctx.fillRect(0, top - 20, w, (Z + 2) * s + 60);

    // Sóng đêm lăn tăn phản chiếu ánh đèn lồng
    ctx.strokeStyle = "rgba(251, 191, 36, 0.16)"; ctx.lineWidth = 1.6;
    for (let l = 0; l < 5; l++) {
      const ly = top + l * 38 * s + Math.sin(now * 0.0022 + l) * 6;
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
    }

    // Hoa lục bình tím trôi lững lờ bên mạn bè
    for (let b = 0; b < 4; b++) {
      const bx = ((b * 450 + now * 0.02) % (w + 100)) - 50;
      const by = top + 15 + (b % 2) * (Z * s - 10) + Math.sin(now * 0.003 + b) * 4;
      ctx.fillStyle = "#8b5cf6"; ctx.beginPath(); ctx.ellipse(bx, by, 7, 4, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#22c55e"; ctx.beginPath(); ctx.ellipse(bx - 3, by + 3, 5, 2.5, -0.4, 0, Math.PI * 2); ctx.fill();
    }

    // 2. Sàn gỗ ghép ván nhà bè Má Tư (ấm cúng, sang trọng)
    const floorGrad = ctx.createLinearGradient(sx(0), sy(Z), sx(X), sy(0));
    floorGrad.addColorStop(0, "#78350f");
    floorGrad.addColorStop(0.5, "#92400e");
    floorGrad.addColorStop(1, "#592305");
    ctx.fillStyle = floorGrad; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);

    // Đường ghép ván gỗ & vân gỗ
    ctx.strokeStyle = "rgba(30, 10, 4, 0.35)"; ctx.lineWidth = 1.2;
    for (let vz = 1; vz < Z; vz += 1.2) {
      ctx.beginPath(); ctx.moveTo(sx(0), sy(vz)); ctx.lineTo(sx(X), sy(vz)); ctx.stroke();
    }
    // Viền khung be tàu chắc chắn có bóng đổ
    ctx.strokeStyle = "#381504"; ctx.lineWidth = 6; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

    // 3. Đồ vật trang trí quán ăn Chợ Nổi Nam Bộ
    // Chiếc lu sành da lươn Lái Thiêu ở góc quán
    const luX = sx(0.6), luY = sy(0.8);
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(luX, luY + 10, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#7c2d12"; ctx.beginPath(); ctx.arc(luX, luY, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ca8a04"; ctx.beginPath(); ctx.ellipse(luX, luY - 6, 8, 3, 0, 0, Math.PI * 2); ctx.fill(); // miệng lu
    // Gáo dừa múc nước
    ctx.strokeStyle = "#fed7aa"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(luX, luY - 6); ctx.lineTo(luX + 12, luY - 16); ctx.stroke();

    // Sọt tre đựng rau củ tươi rói (bông súng, điên điển)
    const sotX = sx(X - 0.7), sotY = sy(0.8);
    ctx.fillStyle = "#b45309"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(sotX - 10, sotY - 10, 20, 20, 4) : ctx.rect(sotX - 10, sotY - 10, 20, 20); ctx.fill();
    ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(sotX - 2, sotY - 6, 4, 0, Math.PI * 2); ctx.fill(); // hoa điên điển
    ctx.fillStyle = "#f43f5e"; ctx.beginPath(); ctx.arc(sotX + 4, sotY - 4, 4.5, 0, Math.PI * 2); ctx.fill(); // hoa bông súng

    // 4. Dây lồng đèn vàng rực rỡ giăng dọc mé bè
    for (let dx = 0; dx <= X; dx += 2.5) {
      const lx = sx(dx), ly = sy(Z) - 2;
      const lampGlow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 22);
      lampGlow.addColorStop(0, "rgba(253, 224, 71, 0.45)");
      lampGlow.addColorStop(1, "rgba(253, 224, 71, 0)");
      ctx.fillStyle = lampGlow; ctx.fillRect(lx - 25, ly - 25, 50, 50);

      // Đèn lồng đỏ vàng
      ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.ellipse(lx, ly, 5.5, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(lx, ly, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Bếp lò đất nung Sa Đéc B1, B2
  (snap.stoves || []).forEach((st) => drawStove(st, sx, sy, s, now));

  // Bàn ăn tròn gỗ mít T1-T4 & Khách ăn
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {}, angryTables = [];
  (snap.customers || []).forEach((c) => {
    byTable[c.table_id] = c;
    if (c.state === "waiting" && c.patience_ticks_left !== undefined && c.patience_ticks_left / patMax < 0.25) {
      angryTables.push(c.table_id);
    }
  });
  (snap.tables || []).forEach((tb) => drawTable(tb, sx, sy, s, byTable, patMax, now));

  if (angryTables.length) text("⚠ Khách " + angryTables.join(", ") + " sắp giận!", w / 2, top + 30, { size: 22, align: "center", color: "#ff5252", warn: true, box: true, bold: true });

  // Người chơi Út Sen tối
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (!hc) drawUtSenQuan(px, py, s, snap.hand, now);
    else {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    }
    if (snap.hand) {
      text(di(dishOf(snap.hand)) + " " + dn(dishOf(snap.hand)), px, py - 0.95 * s, { align: "center", color: hc ? "#fff" : "#2a1a0a", bold: true });
    }
  }

  updateAndDrawParticles();

  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: snap.time_left_ticks <= 1800 ? "#ff8a80" : "#e8eef2", bold: true });
  if (snap.mode === "day") text("Ngày " + snap.day + "/" + (snap.days_total || "?"), w - 14, 28, { size: 18, align: "right", bold: true });
  const shift = snap.mode === "day" && snap.stats && snap.stats.day ? snap.stats.day.earned : snap.earned;
  text(`Tiền ca ${shift ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} ⭐`, 110, 28, { size: 20, bold: true });
  const avail = availableCounts();
  const kinds = Object.keys(avail).sort().filter((k) => avail[k] > 0);
  text("Kho khả dụng: " + (kinds.map((k) => (KIND_NAME[k] || k) + " ×" + avail[k]).join(" · ") || "(hết)"), 14, 60, { color: "#cfd8dc" });
  text("Trên tay: " + (snap.hand ? dn(dishOf(snap.hand)) : "trống"), w - 14, 60, { align: "right", color: "#cfd8dc", bold: true });
  if (FR() && Array.isArray(snap.stock)) {
    const S = items(snap.stock), low = {};
    S.filter((it) => !isSpoiled(it)).forEach((it) => (low[it.kind] = Math.min(low[it.kind] ?? Infinity, it.fresh)));
    const bad = countBy(S.filter(isSpoiled));
    const parts = Object.keys(low).sort().map((k) => `${KIND_NAME[k] || k} ≥${Math.floor(low[k])}`);
    const badTxt = Object.keys(bad).sort().map((k) => `${KIND_NAME[k] || k} ×${bad[k]}`).join(" · ");
    text("Độ tươi: " + (parts.join(" · ") || "—") + (badTxt ? "   🥀 Ươn: " + badTxt : ""), 14, 90, { color: badTxt ? "#ffab91" : "#a5d6a7" });
  }
}

// CẢNH GATHER (LẶN SÔNG BÌNH MINH NAM BỘ)
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 96, bottom = 76;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const now = performance.now();

  if (hc) {
    ctx.fillStyle = HC.sky; ctx.fillRect(0, top, w, SKY * s);
    const g = ctx.createLinearGradient(0, oy, 0, sy(D));
    g.addColorStop(0, HC.water0); g.addColorStop(1, HC.water1);
    ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  } else {
    // 1. Bầu trời bình minh sông nước miền Tây
    const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
    skyGrad.addColorStop(0, "#ffb58a");
    skyGrad.addColorStop(0.35, "#fed18c");
    skyGrad.addColorStop(0.7, "#faedcd");
    skyGrad.addColorStop(1, "#d0f4de");
    ctx.fillStyle = skyGrad; ctx.fillRect(0, top, w, SKY * s);

    const sunGrad = ctx.createRadialGradient(w * 0.75, top + 15, 5, w * 0.75, top + 15, 120);
    sunGrad.addColorStop(0, "rgba(255, 243, 176, 0.7)");
    sunGrad.addColorStop(1, "rgba(255, 243, 176, 0)");
    ctx.fillStyle = sunGrad; ctx.fillRect(0, top, w, SKY * s);

    // Mây trôi lãng đãng buổi sớm
    ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 380 + now * 0.016) % (w + 240)) - 120;
      ctx.beginPath();
      ctx.ellipse(cx, top + 16 + (i % 2) * 12, 50, 14, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 28, top + 12 + (i % 2) * 12, 38, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Đàn cò trắng 3 con bay ngang trời
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.8;
    for (let c = 0; c < 3; c++) {
      const coX = ((c * 45 + now * 0.04) % (w + 100)) - 50;
      const coY = top + 18 + c * 8 + Math.sin(now * 0.005 + c) * 3;
      const wing = Math.sin(now * 0.012 + c) * 4;
      ctx.beginPath();
      ctx.moveTo(coX - 8, coY - wing);
      ctx.lineTo(coX, coY);
      ctx.lineTo(coX + 8, coY - wing);
      ctx.stroke();
    }

    // 2. Dòng sông Chín Khúc màu phù sa trù phú
    const waterGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
    waterGrad.addColorStop(0, "#2a9d8f");
    waterGrad.addColorStop(0.2, "#21867a");
    waterGrad.addColorStop(0.55, "#1d4e61");
    waterGrad.addColorStop(1, "#0a1926");
    ctx.fillStyle = waterGrad; ctx.fillRect(sx(0), oy, X * s, D * s);

    // 3. Luồng ánh sáng mặt trời chiếu xiên (God rays)
    ctx.save();
    ctx.globalAlpha = 0.09;
    ctx.fillStyle = "#fff7cc";
    for (let r = 0; r < 6; r++) {
      const rx = sx(10 + r * 16 + Math.sin(now * 0.0006 + r) * 8);
      ctx.beginPath();
      ctx.moveTo(rx, oy);
      ctx.lineTo(rx - 45 * s, sy(D));
      ctx.lineTo(rx - 22 * s, sy(D));
      ctx.lineTo(rx + 22 * s, oy);
      ctx.fill();
    }
    ctx.restore();

    // 4. Hạt phù sa lơ lửng trong nước
    ctx.save();
    ambientParticles.forEach((p) => {
      const py = oy + ((p.y + now * p.speed * 0.05) % (D * s));
      const px = sx(0) + (p.x % (X * s));
      ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
      ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // 5. Rặng dừa nước ven bến bờ (2 lớp Parallax)
    ctx.fillStyle = "#1b4332";
    for (let x = -2; x <= 20; x += 4) {
      const bx = sx(x), by = oy;
      ctx.beginPath(); ctx.ellipse(bx, by - 6, 2.2 * s, 1.2 * s, -0.15, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#2d6a4f";
    for (let x = -1; x <= 19; x += 3.6) {
      const bx = sx(x), by = oy;
      ctx.beginPath(); ctx.ellipse(bx, by - 3, 1.9 * s, 0.95 * s, 0.15, 0, Math.PI * 2); ctx.fill();
    }

    // 6. Mặt nước sóng gợn lăn tăn
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let x = 0; x <= X; x += 1) {
      const wave = Math.sin(x * 0.45 + now * 0.0035) * (0.14 * s);
      if (x === 0) ctx.moveTo(sx(x), oy + wave);
      else ctx.lineTo(sx(x), oy + wave);
    }
    ctx.stroke();

    // 7. Lớp bùn non trầm tích và rong rêu ở đáy sông
    ctx.fillStyle = "#1b263b";
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(D));
    for (let x = 0; x <= X; x += 2) {
      const bump = Math.sin(x * 0.3) * (0.35 * s);
      ctx.lineTo(sx(x), sy(D) - bump);
    }
    ctx.lineTo(sx(X), sy(D) + 10);
    ctx.lineTo(sx(0), sy(D) + 10);
    ctx.fill();

    ctx.strokeStyle = "rgba(45, 106, 79, 0.65)"; ctx.lineWidth = 2;
    for (let x = 4; x <= X; x += 8) {
      const sway = Math.sin(now * 0.003 + x) * (0.3 * s);
      ctx.beginPath();
      ctx.moveTo(sx(x), sy(D));
      ctx.quadraticCurveTo(sx(x) + sway, sy(D - 2.5), sx(x) + sway * 1.5, sy(D - 4.5));
      ctx.stroke();
    }
  }

  // Vạch đo độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = hc ? "rgba(255,255,255,.2)" : "rgba(255,255,255,.12)";
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 6, sy(d) - 3, { color: "rgba(255,255,255,.55)" });
  }

  // Bến đò Rạch Sen (cột gỗ mộc, mái lá dừa, cầu tàu và ghe tam bản)
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  if (!hc) {
    const boatBob = Math.sin(now * 0.004) * 2;
    ctx.fillStyle = "#7f4f24";
    ctx.beginPath();
    ctx.moveTo(sx(dp[0] + 1.2), sy(-0.2) + boatBob);
    ctx.lineTo(sx(dp[0] + 2.6), sy(-0.2) + boatBob);
    ctx.lineTo(sx(dp[0] + 2.3), sy(0.4) + boatBob);
    ctx.lineTo(sx(dp[0] + 1.5), sy(0.4) + boatBob);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#58311c"; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = "#5c3d28"; ctx.fillRect(sx(dp[0] - 1.8), sy(-0.9), 3.6 * s, 1.1 * s);
    ctx.fillStyle = "#8a532d";
    ctx.beginPath();
    ctx.moveTo(sx(dp[0] - 2.2), sy(-0.9));
    ctx.lineTo(sx(dp[0]), sy(-2.6));
    ctx.lineTo(sx(dp[0] + 2.2), sy(-0.9));
    ctx.fill();
  } else {
    ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  }
  ctx.strokeStyle = hc ? "#ffffff" : "rgba(255,230,150,.85)";
  ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến Rạch Sen (E)", sx(dp[0]), sy(-2.8), { align: "center", color: hc ? "#fff" : "#4a2c11", bold: true });

  (snap.nodes || []).forEach((n) => {
    if (!hc) drawWaterLily(n, sx, sy, s, D, now);
    else {
      const ready = n.ready !== false;
      ctx.globalAlpha = ready ? 1 : 0.35;
      const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
      ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(nx, ny - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.6 * s, { align: "center", color: "#fff" });
    }
  });

  (snap.fish || []).forEach((f) => {
    if (!hc) drawDetailedFish(f, sx, sy, s, now);
    else {
      ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
      ctx.fillStyle = kc(f.kind);
      ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
      ctx.restore();
    }
  });

  (snap.monsters || []).forEach((m) => {
    if (!hc) drawNamCheoCrocodile(m, sx, sy, s, now);
    else {
      ctx.save(); ctx.translate(sx(m.pos[0]), sy(m.pos[1]));
      const chasing = m.state === "chase";
      ctx.fillStyle = chasing ? "#b34dff" : "#6f4a8e";
      ctx.beginPath(); ctx.ellipse(0, 0, 1.6 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  });

  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.38)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }

    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      if (!hc) drawUtSenGather(px, py, s, p, now);
      else {
        ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
        const a = ((p.heading_deg || 0) * Math.PI) / 180;
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
      }
    }
  }

  updateAndDrawParticles();

  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: snap.time_left_ticks <= 1800 ? "#ff8a80" : "#e8eef2", bold: true });
  if (snap.mode === "day") text("Ngày " + snap.day + "/" + (snap.days_total || "?"), w - 14, 28, { size: 18, align: "right", bold: true });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    const blink = low && Math.floor(performance.now() / 250) % 2;
    bar(110, 8, 220, 26, p.oxygen_ticks / p.oxygen_max_ticks, blink ? "#ffcdd2" : low ? "#ef5350" : "#00b4d8", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    if (low && p.oxygen_ticks > 0) text("⚠ Sắp hết oxy!", w / 2, 56, { size: 22, align: "center", color: "#ff5252", warn: true, box: true, bold: true });
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 230, 56, { color: "#9fb3c0" });
  hudGatherExtra(w, h);

  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity;
    const H = items(snap.hold);
    const names = countBy(H), bad = countBy(H.filter(isSpoiled));

    // Floating Card gọn gàng góc dưới bên trái, hoàn toàn không chạm vào Quick Toolbar
    const cardX = 14;
    const cardY = h - 68;
    const slotSz = Math.min(20, Math.floor(250 / cap));
    const cardW = Math.max(220, cap * (slotSz + 3) + 20);
    const cardH = 56;

    ctx.save();
    ctx.fillStyle = "rgba(10, 18, 30, 0.88)";
    ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
    ctx.lineWidth = 1.2;
    if (ctx.roundRect) ctx.roundRect(cardX, cardY, cardW, cardH, 8);
    else ctx.rect(cardX, cardY, cardW, cardH);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // Tiêu đề Giỏ đồ
    const summary = Object.keys(names).sort().map((k) => (KIND_NAME[k] || k) + "×" + names[k] + (bad[k] ? `(ươn ${bad[k]})` : "")).join(" · ");
    text(`🎒 Giỏ ${H.length}/${cap} ${summary ? "· " + summary : "(trống)"}`, cardX + 8, cardY + 18, { size: 14, color: "#38bdf8", bold: true });

    // Hàng ô chứa vật phẩm
    const slotsY = cardY + 26;
    for (let i = 0; i < cap; i++) {
      const sx0 = cardX + 8 + i * (slotSz + 3);
      ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
      ctx.fillRect(sx0, slotsY, slotSz, slotSz);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = 1;
      ctx.strokeRect(sx0, slotsY, slotSz, slotSz);

      const it = H[i];
      if (it) {
        ctx.fillStyle = isSpoiled(it) ? "#555555" : kc(it.kind);
        ctx.fillRect(sx0 + 2, slotsY + 2, slotSz - 4, slotSz - 4);
        if (it.fresh !== null && FR()) {
          ctx.fillStyle = freshColor(it);
          ctx.fillRect(sx0 + 2, slotsY + slotSz - 4, (slotSz - 4) * Math.max(0, it.fresh) / (FR().initial || 100), 3);
        }
        if (isSpoiled(it)) {
          ctx.strokeStyle = "#ef4444";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(sx0 + 2, slotsY + 2); ctx.lineTo(sx0 + slotSz - 2, slotsY + slotSz - 2);
          ctx.stroke();
        }
      }
    }
  }
}

// ---------- GIAO DIỆN CHỌN CHẾ ĐỘ CHƠI (MODE SELECTION MENU) ----------
const phaseOf = () => (snap.mode === "day" ? snap.phase : snap.mode);
const dismissed = {};
function panel(w, h, pw, ph, title, subtitle = "") {
  ctx.font = "bold 24px system-ui, -apple-system, sans-serif";
  const titleW = ctx.measureText(title).width;
  pw = Math.max(pw, Math.min(w - 40, titleW + 80));
  ph = Math.max(ph, 240);

  const px = Math.round((w - pw) / 2);
  const py = Math.round((h - ph) / 2);

  ctx.save();
  ctx.fillStyle = "rgba(10, 18, 30, 0.95)";
  ctx.shadowColor = "rgba(0,0,0,0.7)";
  ctx.shadowBlur = 28;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 16);
  else ctx.rect(px, py, pw, ph);
  ctx.fill();

  ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 2.5; ctx.stroke();

  const headerH = subtitle ? 64 : 48;
  ctx.fillStyle = "rgba(245, 158, 11, 0.12)";
  ctx.fillRect(px + 2, py + 2, pw - 4, headerH);
  ctx.strokeStyle = "rgba(245, 158, 11, 0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px + 8, py + headerH); ctx.lineTo(px + pw - 8, py + headerH); ctx.stroke();
  ctx.restore();

  text(title, w / 2, py + 32, { size: 24, align: "center", color: "#fef08a", bold: true });
  if (subtitle) {
    text(subtitle, w / 2, py + 52, { size: 14, align: "center", color: "#93c5fd", bold: false });
  }
  return py + headerH;
}
function lines(arr, x, y0, o = {}) { arr.forEach((s, i) => text(s, x, y0 + i * (o.step || 26), { size: o.size || 18, align: o.align || "left", color: o.color })); }
function dishList(obj) { return Object.keys(obj || {}).map((d) => `${dn(d)} ×${obj[d]}`); }
function ingList(obj) { return Object.keys(obj || {}).sort().map((k) => `${KIND_NAME[k] || k} ×${obj[k]}`); }

function drawPause(w, h) {

function dayIntro(w, h) {
  if (snap.mode !== "day" || !snap.day_plan) return;
  const ph = phaseOf();
  if (snap.phase_tick >= 240 || dismissed[snap.day + ":" + ph]) return;
  let pH = 300;
  if (ph === "gather") {
    const y = panel(w, h, 560, pH, `Ngày ${snap.day}/${snap.days_total || "?"} — Má Tư Dặn Dò`);
    lines(["Món định nấu hôm nay:", ...dishList(snap.day_plan.dishes).map((s) => "  " + s), "Nguyên liệu cần lấy:", ...ingList(snap.day_plan.ingredients).map((s) => "  " + s)], w / 2 - 230, y + 40, { step: 24 });
  } else if (ph === "quan") {
    const stock = countBy(items(snap.stock).filter((it) => !isSpoiled(it))), menu = snap.menu_data || {};

    pH = 260;
    const y = panel(w, h, 560, pH, "Tối rồi — Mở Quán Nhà Bè");
    lines(["Nguyên liệu trong kho: " + (ingList(stock).join(", ") || "(trống)"), "Món có thể nấu: " + (ok.map(dn).join(", ") || "(chưa món nào)")], w / 2 - 230, y + 50, { step: 30 });
  }
  text("Bấm phím bất kỳ hoặc click để tiếp tục", w / 2, (h + pH) / 2 - 14, { align: "center", color: "#9fb3c0" });
}

  text(`Đang áp dụng: Oxy cấp ${(snap.active_upgrades || {}).oxygen || 0}, Máu cấp ${(snap.active_upgrades || {}).hp || 0}`, w / 2 - 290, y + 285, { color: "#9fb3c0" });
  text("Phím 1: Mua oxy · Phím 2: Mua áo phao · Enter: Xong", w / 2 - 290, y + 325, { size: 18, color: "#69f0ae", bold: true });
  text("Tự động chuyển ngày sau: " + fmtTime(snap.time_left_ticks), w / 2 - 290, y + 355, { color: "#9fb3c0" });
  text("Ngày " + snap.day + "/" + (snap.days_total || "?"), w - 14, 28, { size: 18, align: "right", bold: true });
}

function drawSummary(w, h) {
  const st = snap.stats || {}, sold = st.sold || {};
  const best = Object.keys(sold).sort((a, b) => sold[b] - sold[a])[0];
  ctx.fillStyle = "rgba(0,0,0,.78)"; ctx.fillRect(0, 0, w, h);
  const y = panel(w, h, 580, 340, "Tổng Kết 5 Ngày Kinh Doanh");
  lines([`Số Ngày hoàn tất: ${snap.day}`, `Tổng tiền tích lũy: ${snap.money}k · Tổng doanh thu: ${snap.earned}k`, `Uy tín thương hiệu: ${snap.reputation.toFixed(1)} ⭐`,
         `Tổng điểm thành tựu: ${snap.score} điểm`, `Món ăn bán chạy nhất: ${best ? dn(best) + " ×" + sold[best] : "(chưa bán)"}`, `Khách đã phục vụ: ${st.served ?? 0} · Khách bỏ đi: ${st.left ?? 0}`],
        w / 2 - 240, y + 50, { step: 30 });
  text("Nhấn phím R để chơi lại từ đầu", w / 2, y + 280, { align: "center", color: "#69f0ae", bold: true });
}

function hudGatherExtra(w, h) {
  const p = snap.player || {};
  const need = snap.day_plan ? snap.day_plan.ingredients : null;
  if (need) {
    const have = countBy(items(snap.hold).filter((it) => !isSpoiled(it)));
    const parts = Object.keys(need).sort().map((k) => `${KIND_NAME[k] || k} ${Math.min(have[k] || 0, need[k])}/${need[k]}`);
    text("Đã lấy/cần: " + parts.join(" · "), 14, 84, { color: "#ffe9a8", bold: true });
    if (snap.reservations && snap.reservations.length) text("Đặt trước: " + snap.reservations.map((r) => `${r.id} ${r.table_id} ${dn(r.dish_id)} lúc ${fmtTime(r.arrival_tick)}`).join(" · "), 14, 112, { color: "#0b3d6b" });
  }
  if (p.pos) text(`Sâu ${Math.max(0, p.pos[1]).toFixed(1)} m`, 14, 56, { color: "#cfe3ee" });
  const nodes = snap.nodes || [];
  const interactR = snap.meta.interact_radius || 2;
  const readyNode = nodes.find((n) => n.ready !== false && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= interactR);
  const nearNodeAny = !readyNode && nodes.find((n) => n.ready !== false && Math.abs(n.pos[0] - p.pos[0]) <= interactR + 0.8 && p.pos[1] > 0.5);

  if (p.at_surface && readyNode) {
    const kName = KIND_NAME[readyNode.kind] || "hoa";
    text(`🌸 E: Hái ${kName}`, w / 2, 124, { size: 20, align: "center", color: "#ffe082", bold: true });
  } else if (!p.at_surface && (readyNode || nearNodeAny)) {
    const targetNode = readyNode || nearNodeAny;
    const kName = KIND_NAME[targetNode.kind] || "hoa";
    text(`🏊 Bơi lên mặt nước (Ấn W / Phím Lên) để hái ${kName}!`, w / 2, 124, { size: 18, align: "center", color: "#facc15", bold: true, box: true });
  } else if (p.at_surface) {
    const regrowNode = nodes.find((n) => n.ready === false && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= interactR + 1.2);
    if (regrowNode) {
      const sLeft = Math.ceil((regrowNode.regrow_ticks || 0) / 60);
      const kName = KIND_NAME[regrowNode.kind] || "Bông";
      text(`⏳ ${kName} đang mọc lại (còn ${sLeft}s) · Chờ hồi hoặc lặn bắt cá!`, w / 2, 124, { size: 18, align: "center", color: "#facc15", bold: true });
    }
  }
  if (p.pos && Math.hypot(p.pos[0] - (snap.meta.dock_pos || [2, 0])[0], p.pos[1]) <= (snap.meta.dock_radius || 3))
    text("E: cập bến", w / 2, 150, { size: 20, align: "center", color: "#ffe082", bold: true });
  if (p.oxygen_ticks === 0 && !p.at_surface) text("⚠ Hết hơi!", w / 2, 170, { size: 30, align: "center", color: "#ff5252", warn: true, box: true, bold: true });
  const species = (snap.meta.monsters && snap.meta.monsters.species) || {};
  const near = p.pos && (snap.monsters || []).some((m) => m.state === "chase" ||
    (species[m.kind] && species[m.kind].detect_radius !== undefined && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= species[m.kind].detect_radius));
  if (near) {
    ctx.strokeStyle = hc ? HC.border : "#b34dff"; ctx.lineWidth = hc ? 14 : 10; ctx.strokeRect(7, 7, w - 14, h - 14); ctx.lineWidth = 1;
    text("⚠ Thủy quái Năm Chèo gần!", w / 2, 200, { size: 28, align: "center", color: "#d58cff", warn: true, box: true, bold: true });
  }
}

// ---------- THANH CÔNG CỤ QUICK BAR THÔNG MINH (KHÔNG BAO GIỜ BỊ ĐÈ CHỮ) ----------
let quickBarBounds = [];
function drawQuickBar(w, h) {
  const items = [
    { id: "h", label: hc ? "🎨 Chuẩn" : "🎨 Tương phản [H]", active: hc },
    { id: "l", label: showDebugLog ? "📜 Ẩn log [L]" : "📜 Nhật ký [L]", active: showDebugLog },
    { id: "f3", label: showFps ? "📊 Ẩn FPS" : "📊 FPS [F3]", active: showFps },
    { id: "esc", label: "⏸ Dừng [Esc]", active: false },
    { id: "r", label: "🔄 Chơi lại [R]", active: false }
  ];

  ctx.font = "bold 15px system-ui, -apple-system, sans-serif";
  const gap = 12;
  const paddingX = 18;
  const itemWidths = items.map((it) => ctx.measureText(it.label).width + paddingX * 2);
  const totalW = itemWidths.reduce((a, b) => a + b, 0) + (items.length - 1) * gap;

  const barY = h - 34;
  const btnH = 26;
  let curX = Math.round((w - totalW) / 2); if (curX < 280) curX = 280;

  // Khung nền dải Dock mờ kính (Glassmorphism backdrop)
  ctx.save();
  ctx.fillStyle = "rgba(4, 9, 15, 0.85)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
  ctx.lineWidth = 1;
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(curX - 14, barY - 6, totalW + 28, btnH + 12, 12) : ctx.rect(curX - 14, barY - 6, totalW + 28, btnH + 12);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  quickBarBounds = [];
  items.forEach((it, i) => {
    const btnW = itemWidths[i];
    const isHover = mousePos.x >= curX && mousePos.x <= curX + btnW && mousePos.y >= barY && mousePos.y <= barY + btnH;
    quickBarBounds.push({ id: it.id, x: curX, y: barY, w: btnW, h: btnH });

    ctx.fillStyle = it.active ? "rgba(245, 158, 11, 0.35)" : isHover ? "rgba(56, 189, 248, 0.28)" : "rgba(30, 41, 59, 0.65)";
    ctx.strokeStyle = it.active ? "#f59e0b" : isHover ? "#38bdf8" : "rgba(255, 255, 255, 0.25)";
    ctx.lineWidth = isHover ? 1.5 : 1;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(curX, barY, btnW, btnH, 6) : ctx.rect(curX, barY, btnW, btnH);
    ctx.fill(); ctx.stroke();

    ctx.font = (isHover || it.active ? "bold " : "") + "14px system-ui, -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = it.active ? "#fde047" : isHover ? "#ffffff" : "#cbd5e1";
    ctx.fillText(it.label, curX + btnW / 2, barY + btnH / 2 + 1);

    curX += btnW + gap;
  });
}

// Bộ đếm FPS (F3): trung bình trên cửa sổ 1 s (TICKET-02)
let showFps = false, fpsFrames = 0, fpsT0 = performance.now(), fps = 0;
function fpsTick(w) {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsT0 >= 1000) { fps = (fpsFrames * 1000) / (now - fpsT0); fpsFrames = 0; fpsT0 = now; }
  if (showFps) text(`FPS ${fps.toFixed(0)} · ${innerWidth}×${innerHeight}`, w - 14, 84, { align: "right", color: "#a5d6a7", bold: true });
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = hc ? HC.bg : "#060d14"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.menu) { drawMenu(w, h); drawQuickBar(w, h); return; }
    const ph = phaseOf();
    if (ph === "shop") drawShop(w, h); else if (ph === "quan") drawQuan(w, h); else drawGather(w, h);
    if (ph !== "shop") eventLog(w, h);
    collectGameToasts(); drawGameToasts(w, h);
    overlay(w, h);
    if (!snap.finished) { dayIntro(w, h); if (snap.state === "paused") drawPause(w, h); }
    drawQuickBar(w, h);
    fpsTick(w);
    if (BENCH) benchTick();
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải dữ liệu trò chơi…", w / 2, h / 2, { align: "center", size: 20 });
  }
}
requestAnimationFrame(frame);
</script>
