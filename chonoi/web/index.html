<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Sông Nước Nam Bộ</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1820;
    color: #f6ead2;
    font: 16px/1.4 "Be Vietnam Pro", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Quán Ăn Chợ Nổi — client canvas 2D.
 * Đọc snapshot từ GET /state, gửi trạng thái phím qua POST /input. UI không quyết luật (docs/contracts/ui-interface.md §0).
 *
 * Định hướng mỹ thuật (art direction):
 *  - Góc nhìn: quán = trên xuống nghiêng 3/4 (thấy mặt nhân vật), gather = nhìn ngang 2.5D.
 *  - Bảng màu ấm "đèn lồng trên sông đêm": gỗ nâu đỏ, đất nung, vàng đèn lồng, xanh rêu, xanh sông.
 *  - Nét viền nâu sẫm (INK) đồng nhất, nguồn sáng chung từ trên-trái, bóng đổ mềm phía dưới-phải.
 *  - HUD = thẻ gỗ sẫm viền vàng; hộp thoại = giấy dó trên khung gỗ, ruy băng đỏ.
 *  - Icon nguyên liệu/món ăn vẽ vector (không phụ thuộc font emoji).
 *  - Lớp tĩnh (sàn bè, sông, bờ dừa) vẽ sẵn vào canvas phụ, chỉ dựng lại khi đổi kích thước/chế độ tương phản.
 */
const cv = document.getElementById("c");
const mainCtx = cv.getContext("2d");
let ctx = mainCtx; // đổi tạm sang canvas phụ khi dựng cache
let snap = null, offline = false;

// ---------- VÀO: PHÍM & CHUỘT ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";
let showDebugLog = false;
let mousePos = { x: 0, y: 0 };

function currentInput() {
  const mode = snap ? (snap.mode === "day" ? snap.phase : snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}
function post(obj) { return fetch("/input", { method: "POST", body: JSON.stringify(obj), headers: { "Content-Type": "application/json" } }).catch(() => {}); }
function tap(obj) {
  const off = {}; for (const k in obj) off[k] = false;
  post(obj).then(() => setTimeout(() => post(off), 50));
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  const k = keyName(e);
  ensureAudio();
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "f3") { showFps = !showFps; e.preventDefault(); }
  else if (k === "h") { hc = !hc; try { localStorage.setItem("chonoi.hc", hc ? "1" : "0"); } catch (err) {} }
  else if (k === "l") { showDebugLog = !showDebugLog; }
  else if (k === "n") { audioOn = !audioOn; try { localStorage.setItem("chonoi.sound", audioOn ? "1" : "0"); } catch (err) {} }
  else if (k === "j") { showJournal = !showJournal; }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); for (const d in dismissed) delete dismissed[d]; }
  else if (snap && snap.menu) {
    if (k === "enter" || k === " " || k === "1") tap({ pause: true });
  }
  else if (k === "escape" || k === "p") tap({ pause: true });
  else if (snap && snap.state === "paused") { if (k === "enter") tap({ pause: true }); else if (k === "m") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); } }
  else if (snap && snap.mode === "day" && snap.phase === "shop") {
    if (k === "1") post({ buy: "oxygen" }); else if (k === "2") post({ buy: "hp" }); else if (k === "enter") tap({ shop_done: true });
  }
  if (snap && snap.mode === "day" && !snap.menu && snap.state !== "paused" && k !== "r") dismissed[snap.day + ":" + snap.phase] = true;
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

cv.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect();
  mousePos.x = (e.clientX - r.left);
  mousePos.y = (e.clientY - r.top);
});

// Click chuột vào các nút Quick Toolbar hoặc Menu
cv.addEventListener("click", (e) => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const [w, h] = [cv.width / (window.devicePixelRatio || 1), cv.height / (window.devicePixelRatio || 1)];

  // Nút Quick Toolbar dưới đáy màn hình
  if (quickBarBounds) {
    for (const b of quickBarBounds) {
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        if (b.id === "h") { hc = !hc; try { localStorage.setItem("chonoi.hc", hc ? "1" : "0"); } catch (err) {} return; }
        if (b.id === "l") { showDebugLog = !showDebugLog; return; }
        if (b.id === "n") { ensureAudio(); audioOn = !audioOn; try { localStorage.setItem("chonoi.sound", audioOn ? "1" : "0"); } catch (err) {} return; }
        if (b.id === "j") { showJournal = !showJournal; return; }
        if (b.id === "f3") { showFps = !showFps; return; }
        if (b.id === "esc") { tap({ pause: true }); return; }
        if (b.id === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); return; }
      }
    }
  }

  // Click màn hình Menu
  if (snap && snap.menu) {
    tap({ pause: true });
  } else if (snap && snap.state === "paused") {
    tap({ pause: true });
  }
});

// ---------- RA: POLL SNAPSHOT ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- BẢNG MÀU & ĐỊNH DANH ----------
const KIND_COLOR = { ca_loc: "#527932", ca_linh: "#c4e0f8", ca_keo: "#d8964d", bong_dien_dien: "#ffca28", bong_sung: "#f06292", keo_neo: "#7cb342" };
const KIND_NAME = { ca_loc: "Cá lóc", ca_linh: "Cá linh", ca_keo: "Cá kèo", bong_dien_dien: "Điên điển", bong_sung: "Bông súng", keo_neo: "Kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm" };
const DISH_ICON = { ca_loc_nuong_trui: "🐟", goi_bong_sung: "🥗", lau_ca_linh_dien_dien: "🍲", canh_chua_ca_loc: "🥣", ca_keo_nuong: "🍢", lau_mam: "🥘" };
const dn = (d) => DISH_NAME[d] || d || "?";
const di = (d) => DISH_ICON[d] || "🍲";
const dishOf = (x) => (x && typeof x === "object" ? x.dish_id : x);

// ---------- ADAPTER KHO & ĐỘ TƯƠI ----------
const FR = () => (snap && snap.freshness) || null;
function items(x) {
  if (Array.isArray(x)) return x.map((it) => (typeof it === "string" ? { id: null, kind: it, fresh: null } : { id: it.id, kind: it.kind, fresh: it.fresh ?? null }));
  const out = [];
  for (const k of Object.keys(x || {}).sort()) for (let i = 0; i < x[k]; i++) out.push({ id: null, kind: k, fresh: null });
  return out;
}
const isSpoiled = (it) => !!(FR() && it.fresh !== null && it.fresh < FR().spoiled_below);
function countBy(list) { const o = {}; list.forEach((it) => (o[it.kind] = (o[it.kind] || 0) + 1)); return o; }

function availableCounts() {
  const custs = snap.customers || [];
  if (Array.isArray(snap.stock)) {
    const held = new Set();
    custs.forEach((c) => (Array.isArray(c.reserved) ? c.reserved : []).forEach((id) => held.add(id)));
    return countBy(items(snap.stock).filter((it) => !held.has(it.id) && !isSpoiled(it)));
  }
  const n = { ...(snap.stock || {}) };
  custs.forEach((c) => { for (const k in (c.reserved || {})) n[k] = (n[k] || 0) - c.reserved[k]; });
  return n;
}
function freshColor(it) {
  if (isSpoiled(it)) return "#7d7d7d";
  const f = it.fresh / ((FR() && FR().initial) || 100);
  return f > 0.66 ? "#66bb6a" : f > 0.4 ? "#ffca28" : "#ef5350";
}


// =========================================================================
// HỆ THỐNG THIẾT KẾ (DESIGN SYSTEM)
// =========================================================================
const P = {
  ink: "#2b1a10", inkSoft: "rgba(43,26,16,.55)",
  woodD: "#4a2c18", wood: "#7a4a2a", woodM: "#94603a", woodL: "#b98353", woodHL: "#dcae78",
  clay: "#b5502e", clayD: "#7c3018", clayL: "#d9774a",
  cream: "#fff3da", paper: "#f3e2bf", paperD: "#e2c995",
  red: "#c43a2c", redD: "#8e2219", gold: "#f2b134", goldL: "#ffd978",
  jade: "#3e9d7f", leaf: "#4f8a3a", leafD: "#2f5a26",
  river: "#0f3646", riverD: "#08202c", teal: "#2a8c8c",
  pink: "#e46a8c", pinkD: "#b8456a", skin: "#f4c9a4", skinD: "#d9a47e", hair: "#1e1512",
  hud: "rgba(30,19,12,.88)", hudLine: "rgba(242,177,52,.6)",
  text: "#fbeed6", textDim: "#d6c3a3", good: "#8fd18a", warn: "#ffcf5a", bad: "#ff6b5b",
};
const FONT = '"Be Vietnam Pro","Nunito","SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif';
const TAU = Math.PI * 2;
const MIN_FONT = 18;
let hc = false;
try { hc = localStorage.getItem("chonoi.hc") === "1"; } catch (err) {}
const HC = { bg: "#000000", text: "#ffffff", warn: "#ffff00", sky: "#000000", water0: "#003b73", water1: "#000000", floor: "#2e2e2e", table: "#5a5a5a", border: "#ff00ff" };

// Băm ổn định (chỉ để chọn ngoại hình/trang trí — không ảnh hưởng luật).
function hash(n) { let x = (n | 0) ^ 0x9e3779b9; x = Math.imul(x ^ (x >>> 16), 0x85ebca6b); x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
function hashStr(s) { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; }

function fontOf(size, o = {}) { return (o.weight || (o.bold ? "700" : "500")) + " " + size + "px " + FONT; }
function measure(s, size = MIN_FONT, o = {}) { ctx.font = fontOf(Math.max(MIN_FONT, size), o); return ctx.measureText(s).width; }
// Mọi chữ đi qua text(): kẹp sàn 18 px (TICKET-04, docs/proof/phase-2/ui-hud.md).
function text(s, x, y, o = {}) {
  const size = Math.max(MIN_FONT, o.size || MIN_FONT);
  ctx.font = fontOf(size, o);
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (hc || o.box) {
    const tw = ctx.measureText(s).width, ax = ctx.textAlign === "center" ? x - tw / 2 : ctx.textAlign === "right" ? x - tw : x;
    ctx.fillStyle = hc ? "#000000" : "rgba(0,0,0,.68)";
    ctx.fillRect(ax - 4, y - size, tw + 8, size + 6);
  }
  if (!hc && o.stroke) { ctx.lineJoin = "round"; ctx.lineWidth = o.strokeW || 4; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  else if (!hc && o.shadow) { ctx.fillStyle = typeof o.shadow === "string" ? o.shadow : "rgba(0,0,0,.55)"; ctx.fillText(s, x, y + 2); }
  ctx.fillStyle = hc ? (o.warn ? HC.warn : HC.text) : (o.color || P.text);
  ctx.fillText(s, x, y);
}
// Cắt chuỗi cho vừa bề ngang (thêm "…").
function fitText(s, maxW, size = MIN_FONT, o = {}) {
  if (measure(s, size, o) <= maxW) return s;
  let t = s;
  while (t.length > 1 && measure(t + "…", size, o) > maxW) t = t.slice(0, -1);
  return t + "…";
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); }
function fillCirc(x, y, r, c) { ctx.fillStyle = c; circ(x, y, r); ctx.fill(); }
function fillEll(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ell(x, y, rx, ry, rot); ctx.fill(); }
function outline(w = 2, c = P.ink) { ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke(); }
function shadowEll(x, y, rx, ry, a = 0.28) { fillEll(x, y, rx, ry, `rgba(10,6,4,${a})`); }

// Thẻ HUD gỗ sẫm viền vàng (không dùng shadowBlur để giữ FPS).
function card(x, y, w, h, o = {}) {
  const r = o.r ?? 12;
  if (hc) { ctx.fillStyle = "#000"; rr(x, y, w, h, r); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = o.hcBorder || "#fff"; ctx.stroke(); return; }
  ctx.fillStyle = "rgba(0,0,0,.32)"; rr(x + 2, y + 4, w, h, r); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, o.top || "rgba(58,36,22,.94)"); g.addColorStop(1, o.bottom || "rgba(28,17,10,.94)");
  ctx.fillStyle = g; rr(x, y, w, h, r); ctx.fill();
  ctx.lineWidth = 1.6; ctx.strokeStyle = o.border || P.hudLine; ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,230,190,.10)"; rr(x + 3, y + 3, w - 6, h - 6, Math.max(2, r - 3)); ctx.stroke();
}
// Hộp thoại giấy dó khung gỗ + ruy băng tiêu đề.
function parchment(x, y, w, h) {
  if (hc) { ctx.fillStyle = "#000"; rr(x, y, w, h, 14); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke(); return; }
  ctx.fillStyle = "rgba(0,0,0,.45)"; rr(x + 6, y + 10, w, h, 18); ctx.fill();
  const fg = ctx.createLinearGradient(0, y, 0, y + h);
  fg.addColorStop(0, P.woodM); fg.addColorStop(1, P.woodD);
  ctx.fillStyle = fg; rr(x, y, w, h, 18); ctx.fill(); outline(2.5);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#fbf0d6"); g.addColorStop(1, "#ead3a4");
  ctx.fillStyle = g; rr(x + 10, y + 10, w - 20, h - 20, 12); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(122,74,42,.45)"; rr(x + 16, y + 16, w - 32, h - 32, 9); ctx.stroke();
  // đinh đồng 4 góc
  [[x + 6, y + 6], [x + w - 6, y + 6], [x + 6, y + h - 6], [x + w - 6, y + h - 6]].forEach(([a, b]) => { fillCirc(a, b, 4, P.gold); circ(a, b, 4); outline(1); });
}
function ribbon(cx, y, label, o = {}) {
  const size = o.size || 26;
  const tw = measure(label, size, { weight: "800" });
  const w = tw + 70, h = size + 22, x = cx - w / 2;
  if (hc) { text(label, cx, y + h / 2 + size / 2 - 3, { size, align: "center", weight: "800" }); return y + h; }
  ctx.fillStyle = P.redD;
  ctx.beginPath(); ctx.moveTo(x - 18, y + 10); ctx.lineTo(x + 14, y + 10); ctx.lineTo(x + 14, y + h + 8); ctx.lineTo(x - 18, y + h + 8); ctx.lineTo(x - 6, y + h / 2 + 9); ctx.closePath(); ctx.fill(); outline(2);
  ctx.beginPath(); ctx.moveTo(x + w + 18, y + 10); ctx.lineTo(x + w - 14, y + 10); ctx.lineTo(x + w - 14, y + h + 8); ctx.lineTo(x + w + 18, y + h + 8); ctx.lineTo(x + w + 6, y + h / 2 + 9); ctx.closePath(); ctx.fill(); outline(2);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#e0503c"); g.addColorStop(1, P.red);
  ctx.fillStyle = g; rr(x, y, w, h, 6); ctx.fill(); outline(2.5);
  ctx.strokeStyle = "rgba(255,217,120,.7)"; ctx.lineWidth = 1.2; rr(x + 5, y + 5, w - 10, h - 10, 4); ctx.stroke();
  text(label, cx, y + h / 2 + size * 0.36, { size, align: "center", weight: "800", color: P.cream, stroke: P.redD, strokeW: 4 });
  return y + h;
}
// Phím bấm (keycap). Trả về bề rộng.
function keycap(label, x, y, o = {}) {
  const size = o.size || MIN_FONT;
  const tw = measure(label, size, { weight: "800" });
  const w = Math.max(size + 12, tw + 16), h = size + 12;
  if (hc) { ctx.fillStyle = "#000"; rr(x, y, w, h, 6); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
  else {
    ctx.fillStyle = o.dark ? "#1b120c" : "#8a6a4a"; rr(x, y + 3, w, h, 6); ctx.fill();
    ctx.fillStyle = o.dark ? "#3a281a" : P.cream; rr(x, y, w, h, 6); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = o.dark ? "rgba(242,177,52,.7)" : P.inkSoft; ctx.stroke();
  }
  text(label, x + w / 2, y + h / 2 + size * 0.36, { size, align: "center", weight: "800", color: o.dark ? P.goldL : P.ink });
  return w;
}
// Viên nhắc thao tác ở giữa màn hình: [phím] + lời nhắc.
function promptPill(cx, y, key, label, tone = "gold") {
  const col = tone === "bad" ? P.bad : tone === "purple" ? "#d9a1ff" : tone === "info" ? "#9fd8ff" : P.goldL;
  const lw = measure(label, 20, { bold: true });
  const kw = key ? measure(key, MIN_FONT, { weight: "800" }) + 16 : 0;
  const w = lw + kw + (key ? 40 : 30), h = 40, x = cx - w / 2;
  card(x, y, w, h, { r: 20, border: col, hcBorder: tone === "bad" || tone === "purple" ? HC.warn : "#fff" });
  let tx = x + 15;
  if (key) { keycap(key, tx, y + 5, { dark: true }); tx += kw + 10; }
  text(label, tx, y + 27, { size: 20, bold: true, color: col, warn: tone === "bad" || tone === "purple" });
}

// ---------- ICON VẼ TAY: NGUYÊN LIỆU ----------
function fishIcon(x, y, r, body, belly, o = {}) {
  const L = r * (o.len || 1), H = r * (o.ht || 0.42);
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-L * 0.62, 0); ctx.lineTo(-L * 1.0, -H * 0.85); ctx.lineTo(-L * 0.95, H * 0.85); ctx.closePath(); ctx.fill(); outline(1.4);
  const g = ctx.createLinearGradient(0, -H, 0, H); g.addColorStop(0, body); g.addColorStop(0.65, body); g.addColorStop(1, belly);
  ctx.fillStyle = g; ell(0, 0, L * 0.72, H); ctx.fill(); outline(1.6);
  if (o.spots) { ctx.fillStyle = "rgba(20,30,10,.55)"; for (let i = 0; i < 4; i++) { circ(-L * 0.35 + i * L * 0.2, -H * 0.15 + (i % 2) * H * 0.3, H * 0.18); ctx.fill(); } }
  if (o.stripe) { ctx.strokeStyle = o.stripe; ctx.lineWidth = Math.max(1, H * 0.18); ctx.beginPath(); ctx.moveTo(-L * 0.5, 0); ctx.lineTo(L * 0.45, -H * 0.05); ctx.stroke(); }
  fillCirc(L * 0.45, -H * 0.2, Math.max(1.2, H * 0.22), "#fff"); fillCirc(L * 0.47, -H * 0.2, Math.max(0.8, H * 0.12), P.ink);
  ctx.restore();
}
function flowerIcon(x, y, r, petal, center, n = 8) {

  const s = Math.max(14, Math.min(48, h / 21, w / 26));

    // icon
    const ix = x + 46, iy = cy + 56;
    if (kind === "oxygen") { ctx.fillStyle = "#3d8fd0"; rr(ix - 14, iy - 28, 28, 56, 12); ctx.fill(); outline(2); ctx.fillStyle = "#c9d3dc"; ctx.fillRect(ix - 6, iy - 36, 12, 9); fillEll(ix - 5, iy - 10, 4, 14, "rgba(255,255,255,.4)"); }
    else { ctx.fillStyle = "#f08a24"; ctx.beginPath(); ctx.moveTo(ix - 24, iy - 26); ctx.lineTo(ix - 8, iy - 30); ctx.lineTo(ix, iy - 20); ctx.lineTo(ix + 8, iy - 30); ctx.lineTo(ix + 24, iy - 26); ctx.lineTo(ix + 22, iy + 26); ctx.lineTo(ix - 22, iy + 26); ctx.closePath(); ctx.fill(); outline(2); ctx.fillStyle = "#f4f1ea"; ctx.fillRect(ix - 22, iy, 44, 8); }
    text(name, x + 90, cy + 36, INK({ weight: "800" }));
    // nấc cấp
    for (let k = 0; k < list.length; k++) { fillCirc(x + 98 + k * 22, cy + 58, 7, k < lv ? P.gold : "rgba(122,74,42,.25)"); circ(x + 98 + k * 22, cy + 58, 7); outline(1.2); }
    if (next) {
      text(`Cấp ${next.level}: ${next[field]}${unit}`, x + 90, cy + 94, INK());
      text(`${next.price}k`, x + 90, cy + 124, INK({ weight: "800", size: 22, color: afford ? P.jade : P.red }));
      keycap(key, x + cw - 50, cy + chh - 46);
    } else text("Đã nâng tối đa", x + 90, cy + 98, INK({ color: P.jade, bold: true }));
  });
  const fy = cy + chh + 34;
  const au = snap.active_upgrades || {};
  text(`Đang dùng hôm nay: oxy cấp ${au.oxygen || 0} · áo phao cấp ${au.hp || 0} (đồ mới mua dùng từ ngày mai)`, w / 2, fy, INK({ align: "center", color: "#6a4a30" }));
  let kx = m.x + 40; const ky = fy + 20;
  kx += keycap("1", kx, ky) + 8; text("mua oxy", kx, ky + 22, INK()); kx += measure("mua oxy") + 22;
  kx += keycap("2", kx, ky) + 8; text("mua áo phao", kx, ky + 22, INK()); kx += measure("mua áo phao") + 22;
  kx += keycap("Enter", kx, ky) + 8; text("sang ngày mới", kx, ky + 22, INK({ bold: true }));
  text("Tự sang ngày mới sau " + fmtTime(snap.time_left_ticks), w / 2, ky + 66, INK({ align: "center", color: "#6a4a30" }));
  if (snap.mode === "day") { const lbl = "Ngày " + snap.day + "/" + (snap.days_total || "?"); const dw = measure(lbl, 22, { weight: "800" }) + 34; card(w - 14 - dw, 10, dw, 56); text(lbl, w - 14 - dw / 2, 46, { size: 22, weight: "800", align: "center", color: P.goldL }); }
}
function drawSummary(w, h) {
  const st = snap.stats || {}, sold = st.sold || {};
  const best = Object.keys(sold).sort((a, b) => sold[b] - sold[a])[0];
  ctx.fillStyle = "rgba(5,8,12,.72)"; ctx.fillRect(0, 0, w, h);
  const m = modal(w, h, 640, 470, `Tổng kết ${snap.day} ngày buôn bán`);
  text(`${snap.score}`, w / 2, m.top + 64, INK({ align: "center", size: 56, weight: "900", color: P.redD }));
  text("điểm thành tựu", w / 2, m.top + 92, INK({ align: "center", color: "#6a4a30" }));
  for (let i = 0; i < 5; i++) drawStar(w / 2 - 60 + i * 30, m.top + 122, 12, Math.max(0, Math.min(1, snap.reputation - i)));
  const rows = [
    ["Tiền trong ví", `${snap.money}k`], ["Tổng doanh thu", `${snap.earned}k`],
    ["Khách đã phục vụ", `${st.served ?? 0}`], ["Khách bỏ về", `${st.left ?? 0}`],
  ];
  rows.forEach(([l, v], i) => { const y = m.top + 170 + i * 34; text(l, m.x + 70, y, INK({ color: "#6a4a30" })); text(v, m.x + m.w - 70, y, INK({ align: "right", weight: "800" })); ctx.fillStyle = "rgba(122,74,42,.2)"; ctx.fillRect(m.x + 70, y + 10, m.w - 140, 1); });
  const by = m.top + 170 + rows.length * 34 + 10;
  if (best) { drawDish(best, m.x + 86, by + 6, 14); text(`Bán chạy nhất: ${dn(best)} ×${sold[best]}`, m.x + 110, by + 13, INK({ bold: true })); }
  else text("Chưa bán được món nào", m.x + 70, by + 13, INK({ color: "#6a4a30" }));
  const ky = m.y + m.h - 64; const kw = keycap("R", w / 2 - 90, ky); text("chơi lại từ đầu", w / 2 - 90 + kw + 10, ky + 22, INK({ bold: true }));
}
function eventLog(w, h) {
  if (!showDebugLog) return;
  const ev = (snap.events || []).slice(-4);
  const bw = Math.min(560, w - 28), x = w - 14 - bw, y = h - 60 - 150;
  card(x, y, bw, 140, { border: "rgba(129,212,250,.6)" });
  text("Nhật ký engine (L để ẩn)", x + 14, y + 28, { bold: true, color: "#81d4fa" });
  ev.forEach((e, i) => text(fitText(`t${e.tick} ${e.name} ${brief(e.data)}`, bw - 28), x + 14, y + 56 + i * 22, { color: "rgba(232,238,242,.85)" }));
}
function overlay(w, h) {
  if (offline) promptPill(w / 2, h / 2 - 20, null, "Mất kết nối tới máy chủ (đã tắt chưa?)", "bad");
  if (snap.error) promptPill(w / 2, 130, "R", "Luật của nhóm báo lỗi, xem terminal", "bad");
  if (snap.finished && snap.mode === "day") { drawSummary(w, h); return; }
  if (snap.finished) {
    ctx.fillStyle = "rgba(5,8,12,.6)"; ctx.fillRect(0, 0, w, h);
    const m = modal(w, h, 560, 230, "Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc");
    const RS = { time: "Hết giờ", docked: "Út Sen đã cập bến", fainted: "Út Sen ngất vì kiệt sức", error: "Luật báo lỗi" };
    text(fitText(RS[snap.reason] || snap.reason || "", m.w - 80), w / 2, m.top + 40, INK({ align: "center", bold: true }));
    const ky = m.top + 80; const kw = keycap("R", w / 2 - 90, ky); text("chơi lại từ đầu", w / 2 - 90 + kw + 10, ky + 22, INK({ bold: true }));
  }
}

// ---------- THANH CÔNG CỤ ----------
let quickBarBounds = [];
function drawQuickBar(w, h) {
  const list = [
    { id: "h", key: "H", label: "Tương phản", active: hc },
    { id: "l", key: "L", label: "Nhật ký", active: showDebugLog },
    { id: "f3", key: "F3", label: "FPS", active: showFps },
    { id: "n", key: "N", label: audioOn ? "Âm thanh" : "Tắt tiếng", active: audioOn },
    { id: "j", key: "J", label: "Sổ tay", active: showJournal },
    { id: "esc", key: "Esc", label: "Dừng", active: false },
    { id: "r", key: "R", label: "Chơi lại", active: false },
  ];
  const gap = 6, bh = 38;
  // màn hẹp: ẩn chữ nút phụ trước, giữ chữ Esc/R; vẫn chật thì chỉ hiện phím (chừa chỗ cho giỏ tre góc trái)
  const MAIN = new Set(["esc", "r"]), room = w - 560;
  const sizeOf = (lv) => list.map((it) => measure(it.key, MIN_FONT, { weight: "800" }) + (lv === 0 || (lv === 1 && MAIN.has(it.id)) ? 16 + 8 + measure(it.label) + 22 : 28));
  let lv = 0, widths = sizeOf(0), tot = 0;
  const sum = () => widths.reduce((a, b) => a + b, 0) + gap * (list.length - 1);
  tot = sum();
  while (tot > room && lv < 2) { lv++; widths = sizeOf(lv); tot = sum(); }
  const showLabel = (it) => lv === 0 || (lv === 1 && MAIN.has(it.id));
  let x = w - 14 - tot; const y = h - bh - 10;
  quickBarBounds = [];
  list.forEach((it, i) => {
    const bw = widths[i];
    const hover = mousePos.x >= x && mousePos.x <= x + bw && mousePos.y >= y && mousePos.y <= y + bh;
    quickBarBounds.push({ id: it.id, x, y, w: bw, h: bh });
    card(x, y, bw, bh, { r: 10, border: it.active ? P.gold : hover ? "#9fd8ff" : "rgba(242,177,52,.35)", top: hover ? "rgba(80,52,30,.95)" : undefined });
    const kw = keycap(it.key, x + 6, y + 4, { dark: true });
    if (showLabel(it)) text(it.label, x + 6 + kw + 8, y + 26, { color: it.active ? P.goldL : hover ? "#fff" : P.textDim, bold: it.active || hover });
    x += bw + gap;
  });
}
let showFps = false, fpsFrames = 0, fpsT0 = performance.now(), fps = 0;
function fpsTick(w, h) {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsT0 >= 1000) { fps = (fpsFrames * 1000) / (now - fpsT0); fpsFrames = 0; fpsT0 = now; }
  if (showFps) text(`FPS ${fps.toFixed(0)} · ${innerWidth}×${innerHeight}`, w - 14, h - 62, { align: "right", color: "#a5d6a7", bold: true, box: true });
}
function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = hc ? HC.bg : "#0b1820"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.menu) { drawMenu(w, h); drawQuickBar(w, h); return; }
    const ph = phaseOf();
    toastY = 96;
    const shaking = performance.now() < shakeUntil && !hc;
    if (shaking) { ctx.save(); ctx.translate((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 10); }
    if (ph === "shop") drawShop(w, h); else if (ph === "quan") drawQuan(w, h); else drawGather(w, h);
    if (shaking) ctx.restore();
    if (ph === "gather" && snap.state !== "paused" && !snap.finished) { checkStateAchievements(); lowOxygenBeat(); }
    drawFlyFx(); drawFlash(w, h);
    if (ph === "quan") toastY = 130;
    if (ph !== "shop") eventLog(w, h);
    collectGameToasts(); drawGameToasts(w, h);
    overlay(w, h);
    if (!snap.finished) { dayIntro(w, h); if (snap.state === "paused") drawPause(w, h); }
    drawJournal(w, h);
    drawQuickBar(w, h);
    fpsTick(w, h);
    if (BENCH) benchTick();
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải dữ liệu trò chơi…", w / 2, h / 2, { align: "center", size: 22 });
  }
}
requestAnimationFrame(frame);
</script>
