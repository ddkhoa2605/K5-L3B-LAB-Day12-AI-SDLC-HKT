<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.mode === "day" ? snap.phase : snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function post(obj) { return fetch("/input", { method: "POST", body: JSON.stringify(obj), headers: { "Content-Type": "application/json" } }).catch(() => {}); }
function tap(obj) {   // cạnh lên: gửi true rồi false
  const off = {}; for (const k in obj) off[k] = false;
  post(obj).then(() => setTimeout(() => post(off), 50));
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "f3") { showFps = !showFps; e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); for (const d in dismissed) delete dismissed[d]; }
  else if (snap && snap.menu) { if (k === "enter" || k === " ") tap({ pause: true }); }
  else if (k === "escape" || k === "p") tap({ pause: true });
  else if (snap && snap.state === "paused") { if (k === "enter") tap({ pause: true }); else if (k === "m") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); } }
  else if (snap && snap.mode === "day" && snap.phase === "shop") {
    if (k === "1") post({ buy: "oxygen" }); else if (k === "2") post({ buy: "hp" }); else if (k === "enter") tap({ shop_done: true });
  }
  if (snap && snap.mode === "day" && !snap.menu && snap.state !== "paused" && k !== "r") dismissed[snap.day + ":" + snap.phase] = true;
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm" };
const dn = (d) => DISH_NAME[d] || d || "?";
// Kho cá thể v1.2: hold/stock là mảng {id, kind, fresh}; ươn khi fresh < 30 (manifest: freshness.spoiled_below)
const SPOIL = 30;
const isSpoiled = (i) => i.fresh < SPOIL;
function countKinds(items, onlyUsable) { const c = {}; (items || []).forEach((i) => { if (!onlyUsable || !isSpoiled(i)) c[i.kind] = (c[i.kind] || 0) + 1; }); return c; }
const freshColor = (f) => (f < SPOIL ? "#7a7a7a" : f < 50 ? "#ef5350" : f < 75 ? "#ffca28" : "#66bb6a");
function freshLabel(items) {  // "tươi TB 83% · 1 ươn"
  const n = (items || []).length; if (!n) return "";
  const sp = items.filter(isSpoiled).length, avg = items.reduce((a, i) => a + i.fresh, 0) / n;
  return `tươi TB ${avg.toFixed(0)}%` + (sp ? ` · ${sp} ươn` : "");
}
const dishOf = (x) => (x && typeof x === "object" ? x.dish_id : x);   // dish/hand là payload {order_id, dish_id, base_price}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
const MIN_FONT = 18;   // TICKET-02: chữ không chân >= 18 px ở 1280x720 — mọi chữ vẽ qua text() đều bị kẹp sàn này
function text(s, x, y, o = {}) {
  ctx.font = Math.max(MIN_FONT, o.size || MIN_FONT) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 5, { align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-4);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 44 - (ev.length - 1 - i) * 22, { align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80" });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80" });
  if (snap.finished && snap.mode === "day") { drawSummary(w, h); return; }
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 96, bottom = 76;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { color: "rgba(255,255,255,.45)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.6 * s, { align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  // thủy quái (v1.1: có khi gather của nhóm xuất monsters[])
  (snap.monsters || []).forEach((m) => {
    ctx.fillStyle = m.state === "chase" ? "#b34dff" : "#6f4a8e";
    ctx.beginPath(); ctx.ellipse(sx(m.pos[0]), sy(m.pos[1]), 1.6 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: snap.time_left_ticks <= 1800 ? "#ff8a80" : "#e8eef2" });
  if (snap.mode === "day") text("Ngày " + snap.day + "/" + (snap.days_total || "?"), w - 14, 28, { size: 18, align: "right" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    const blink = low && Math.floor(performance.now() / 250) % 2;   // dưới 25%: đổi màu + nhấp nháy
    bar(110, 8, 220, 26, p.oxygen_ticks / p.oxygen_max_ticks, blink ? "#ffcdd2" : low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 230, 56, { color: "#9fb3c0" });
  hudGatherExtra(w, h);
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(26, (w - 260) / cap - 4), y0 = h - bottom + 6;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const it = snap.hold[i];
      if (it) {
        ctx.fillStyle = kc(it.kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        ctx.fillStyle = freshColor(it.fresh); ctx.fillRect(x0 + 3, y0 + sz - 6, (sz - 6) * Math.max(0, Math.min(1, it.fresh / 100)), 4);  // thanh độ tươi
        if (isSpoiled(it)) { ctx.strokeStyle = "#ff5252"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0 + 2, y0 + 2); ctx.lineTo(x0 + sz - 2, y0 + sz - 2); ctx.moveTo(x0 + sz - 2, y0 + 2); ctx.lineTo(x0 + 2, y0 + sz - 2); ctx.stroke(); ctx.lineWidth = 1; }
      }
    }
    const names = countKinds(snap.hold);
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => (KIND_NAME[k] || k) + " ×" + names[k]).join(" · ") + (snap.hold.length ? "  — " + freshLabel(snap.hold) : ""), 14, y0 + sz + 24, { color: "#cfd8dc" });
  }
  text("WASD bơi · E hái/cập bến · Space bắt · Esc dừng", w - 10, 56, { align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 92, bottom = 44;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 6, { align: "center", color: "#111" });
    if (st.dish) text(dn(dishOf(st.dish)), sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      const m = (snap.menu_data || {})[dishOf(st.dish)];   // có ở day; quan độc lập chỉ hiện số giây
      if (m) bar(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) + 0.9 * s, 1.6 * s, 8, 1 - st.cook_ticks_left / (m.cook_s * 60), "#ffb74d");
      text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 0.9 * s + 28, { align: "center", color: "#2a1a0a" });
    }
    if (st.state === "ready") text("Đã chín!", sx(st.pos[0]), sy(st.pos[1]) + 0.9 * s + 22, { align: "center", color: "#1b5e20" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 6, { align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(dn(c.dish_id), cx, cy - 0.75 * s, { align: "center", color: "#2a1a0a" });
      if (c.state === "waiting" && c.patience_ticks_left !== undefined) bar(cx - 0.9 * s, cy + 0.65 * s, 1.8 * s, 8, c.patience_ticks_left / patMax, c.patience_ticks_left / patMax < 0.25 ? "#ff1744" : "#ffb74d");
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      text("🍲 " + dn(dishOf(snap.hand)), px, py - 0.8 * s, { align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: snap.time_left_ticks <= 1800 ? "#ff8a80" : "#e8eef2" });
  if (snap.mode === "day") text("Ngày " + snap.day + "/" + (snap.days_total || "?"), w - 14, 28, { size: 18, align: "right" });
  // Tiền ca: day có stats.day.earned; quan độc lập bắt đầu ca với earned = 0 nên earned là tiền ca.
  const shift = snap.mode === "day" && snap.stats && snap.stats.day ? snap.stats.day.earned : snap.earned;
  text(`Tiền ca ${shift ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)}`, 110, 28, { size: 20 });
  // Kho khả dụng = stock − Σ reserved (chỉ để hiển thị, PRD-0 D/E)
  const held = new Set(); (snap.customers || []).forEach((c) => (c.reserved || []).forEach((id) => held.add(id)));
  const avail = countKinds((snap.stock || []).filter((i) => !held.has(i.id)), true);
  const kinds = Object.keys(avail).sort().filter((k) => avail[k] > 0);
  text("Kho khả dụng: " + (kinds.map((k) => (KIND_NAME[k] || k) + " ×" + avail[k]).join(" · ") || "(hết)") + ((snap.stock || []).length ? "  — " + freshLabel(snap.stock) : ""), 14, 60, { color: "#cfd8dc" });
  text("Trên tay: " + (snap.hand ? dn(dishOf(snap.hand)) : "trống"), w - 14, 60, { align: "right", color: "#cfd8dc" });
}


// ---------- chế độ day (v1.1): menu, DayIntro/EveningIntro, Shop, pause, tổng kết ----------
const phaseOf = () => (snap.mode === "day" ? snap.phase : snap.mode);
const dismissed = {};   // `${ngày}:${pha}` -> true khi người chơi bấm phím qua màn giới thiệu
function panel(w, h, pw, ph, title) {
  ctx.fillStyle = "rgba(10,16,22,.88)"; ctx.fillRect((w - pw) / 2, (h - ph) / 2, pw, ph);
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2; ctx.strokeRect((w - pw) / 2, (h - ph) / 2, pw, ph);
  text(title, w / 2, (h - ph) / 2 + 36, { size: 26, align: "center", color: "#ffd27a" });
  return (h - ph) / 2 + 36;
}
function lines(arr, x, y0, o = {}) { arr.forEach((s, i) => text(s, x, y0 + i * (o.step || 26), { size: o.size || 18, align: o.align || "left", color: o.color })); }
function dishList(obj) { return Object.keys(obj || {}).map((d) => `${dn(d)} ×${obj[d]}`); }
function ingList(obj) { return Object.keys(obj || {}).sort().map((k) => `${KIND_NAME[k] || k} ×${obj[k]}`); }

function drawMenu(w, h) {
  const y = panel(w, h, 460, 250, "Quán Ăn Chợ Nổi");
  lines(["Enter: Chơi", "Q: Thoát (đóng thẻ trình duyệt)", "", "Esc hoặc P: tạm dừng khi đang chơi"], w / 2, y + 50, { align: "center" });
}
function drawPause(w, h) {
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);           // làm mờ nền
  const y = panel(w, h, 420, 220, "Tạm dừng");
  lines(["Esc / P / Enter: Tiếp tục", "M: Về menu", "Đồng hồ và mọi timer đều dừng"], w / 2, y + 50, { align: "center" });
}
function dayIntro(w, h) {
  if (snap.mode !== "day" || !snap.day_plan) return;
  const ph = phaseOf();
  if (snap.phase_tick >= 240 || dismissed[snap.day + ":" + ph]) return;   // tự chuyển sau 4 s hoặc khi bấm phím
  let pH = 300;
  if (ph === "gather") {
    const y = panel(w, h, 560, pH, `Ngày ${snap.day}/${snap.days_total || "?"} — Má Tư dặn`);
    lines(["Món định nấu:", ...dishList(snap.day_plan.dishes).map((s) => "  " + s), "Cần lấy:", ...ingList(snap.day_plan.ingredients).map((s) => "  " + s)], w / 2 - 230, y + 40, { step: 24 });
  } else if (ph === "quan") {
    const stock = countKinds(snap.stock, true), menu = snap.menu_data || {};
    const ok = Object.keys(snap.day_plan.dishes).filter((d) => menu[d] && Object.keys(menu[d].recipe).every((k) => (stock[k] || 0) >= menu[d].recipe[k]));
    pH = 260;
    const y = panel(w, h, 560, pH, "Tối rồi — mở quán");
    lines(["Nhập kho: " + (ingList(stock).join(", ") || "(trống)"), "Nấu được: " + (ok.map(dn).join(", ") || "(chưa món nào)")], w / 2 - 230, y + 50, { step: 30 });
  }
  text("Bấm phím bất kỳ để tiếp tục", w / 2, (h + pH) / 2 - 14, { align: "center", color: "#9fb3c0" });
}
function drawShop(w, h) {
  ctx.fillStyle = "#1b2a36"; ctx.fillRect(0, 0, w, h);
  const st = (snap.stats && snap.stats.day) || {};
  const y = panel(w, h, 640, 470, `Kết quả Ngày ${snap.day}`);
  const rep = snap.reputation - (st.reputation_start ?? snap.reputation);
  lines([`Khách đã phục vụ: ${st.served ?? 0} · bỏ đi: ${st.left ?? 0}`,
         `Thu trong ngày: ${st.earned ?? 0}k (boa ${st.tips ?? 0}k)`,
         `Uy tín: ${snap.reputation.toFixed(1)} (${rep >= 0 ? "+" : ""}${rep.toFixed(1)})`,
         `Tiền: ${snap.money}k · tổng thu ${snap.earned}k · điểm ${snap.score}`], w / 2 - 290, y + 44, { step: 26 });
  text("Cửa hàng — nâng cấp, hiệu lực từ Ngày kế", w / 2 - 290, y + 170, { color: "#9fb3c0" });
  const ups = (snap.shop && snap.shop.upgrades) || {};
  [["oxygen", "1", "Bình oxy", "oxygen_max_s", "s"], ["hp", "2", "Áo phao", "hp_max", " Máu"]].forEach(([kind, key, name, field, unit], i) => {
    const lv = (snap.upgrades || {})[kind] || 0, next = (ups[kind] || [])[lv];
    const label = next ? `${key}: ${name} → cấp ${next.level}: ${next[field]}${unit} (${next.price}k)` : `${key}: ${name} — tối đa (cấp ${lv})`;
    text(label, w / 2 - 290, y + 205 + i * 30, { size: 18, color: next && snap.money >= next.price ? "#a5d6a7" : "#cfd8dc" });
  });
  text(`Đang áp dụng: Oxy cấp ${(snap.active_upgrades || {}).oxygen || 0}, Máu cấp ${(snap.active_upgrades || {}).hp || 0}`, w / 2 - 290, y + 285, { color: "#9fb3c0" });
  text("1: mua oxy · 2: mua áo phao · Enter: xong", w / 2 - 290, y + 325, { size: 18 });
  text("Tự đóng sau " + fmtTime(snap.time_left_ticks), w / 2 - 290, y + 355, { color: "#9fb3c0" });
  text("Ngày " + snap.day + "/" + (snap.days_total || "?"), w - 14, 28, { size: 18, align: "right" });
}
function drawSummary(w, h) {
  const st = snap.stats || {}, sold = st.sold || {};
  const best = Object.keys(sold).sort((a, b) => sold[b] - sold[a])[0];
  ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(0, 0, w, h);
  const y = panel(w, h, 560, 330, "Tổng kết");
  lines([`Số Ngày hoàn tất: ${snap.day}`, `Tổng tiền: ${snap.money}k · tổng thu: ${snap.earned}k`, `Uy tín: ${snap.reputation.toFixed(1)}`,
         `Tổng điểm: ${snap.score}`, `Món bán chạy: ${best ? dn(best) + " ×" + sold[best] : "(chưa bán)"}`, `Khách phục vụ ${st.served ?? 0} · bỏ đi ${st.left ?? 0}`],
        w / 2 - 220, y + 50, { step: 30 });
  text("R: chơi lại", w / 2, y + 270, { align: "center", color: "#9fb3c0" });
}
function hudGatherExtra(w, h) {
  const p = snap.player || {};
  const need = snap.day_plan ? snap.day_plan.ingredients : null;
  if (need) {   // đã lấy / cần
    const have = countKinds(snap.hold, true);  // hàng ươn không tính vào "đã lấy"
    const parts = Object.keys(need).sort().map((k) => `${KIND_NAME[k] || k} ${Math.min(have[k] || 0, need[k])}/${need[k]}`);
    text("Đã lấy/cần: " + parts.join(" · "), 14, 84, { color: "#ffe9a8" });
    if (snap.reservations && snap.reservations.length) text("Đặt trước: " + snap.reservations.map((r) => `${r.id} ${r.table_id} ${dn(r.dish_id)} lúc ${fmtTime(r.arrival_tick)}`).join(" · "), 14, 112, { color: "#0b3d6b" });
  }
  if (p.pos) text(`Sâu ${Math.max(0, p.pos[1]).toFixed(1)} m`, 14, 56, { color: "#cfe3ee" });
  const nodes = snap.nodes || [];
  if (p.at_surface && nodes.some((n) => n.ready !== false && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= (snap.meta.interact_radius || 2)))
    text("E: hái", w / 2, 124, { size: 20, align: "center", color: "#ffe082" });
  if (p.pos && Math.hypot(p.pos[0] - (snap.meta.dock_pos || [2, 0])[0], p.pos[1]) <= (snap.meta.dock_radius || 3))
    text("E: cập bến", w / 2, 150, { size: 20, align: "center", color: "#ffe082" });
  if (p.oxygen_ticks === 0 && !p.at_surface) text("Hết hơi!", w / 2, 170, { size: 30, align: "center", color: "#ff5252" });
  // TICKET-02: "Thủy quái!" + viền tím khi có thủy quái GẦN (không phải sau khi bị cắn).
  // "Gần" = đang đuổi (state chase) hoặc trong detect_radius của loài nếu tuning có khai; ticket chưa định nghĩa, xem docs/clarify.md.
  const species = (snap.meta.monsters && snap.meta.monsters.species) || {};
  const near = p.pos && (snap.monsters || []).some((m) => m.state === "chase" ||
    (species[m.kind] && species[m.kind].detect_radius !== undefined && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= species[m.kind].detect_radius));
  if (near) {
    ctx.strokeStyle = "#b34dff"; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10); ctx.lineWidth = 1;
    text("Thủy quái!", w / 2, 200, { size: 28, align: "center", color: "#d58cff" });
  }
}

// Bộ đếm FPS (F3): trung bình trên cửa sổ 1 s, dùng làm bằng chứng ">= 30 FPS ở 1280x720" (TICKET-02).
let showFps = false, fpsFrames = 0, fpsT0 = performance.now(), fps = 0;
function fpsTick(w) {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsT0 >= 1000) { fps = (fpsFrames * 1000) / (now - fpsT0); fpsFrames = 0; fpsT0 = now; }
  if (showFps) text(`FPS ${fps.toFixed(0)} · ${innerWidth}×${innerHeight}`, w - 14, 84, { align: "right", color: "#a5d6a7" });
}
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.menu) { drawMenu(w, h); return; }
    const ph = phaseOf();
    if (ph === "shop") drawShop(w, h); else if (ph === "quan") drawQuan(w, h); else drawGather(w, h);
    if (ph !== "shop") eventLog(w, h);
    overlay(w, h);
    if (!snap.finished) { dayIntro(w, h); if (snap.state === "paused") drawPause(w, h); }
    fpsTick(w);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
